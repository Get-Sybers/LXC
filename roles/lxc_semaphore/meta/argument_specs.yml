---
argument_specs:
  container:
    short_description: "Ensure the Semaphore LXC on the node through lxc_guest and add it to the play inventory."
    description:
      - >-
        Runs on the Proxmox node (hosts: localhost, connection: local). Hands
        this role's placement inputs to get_sybers.lxc.lxc_guest, which
        preflights, creates, starts, waits for and add_hosts the container into
        lxc_semaphore_group over proxmox_pct_remote.
    options:
      lxc_semaphore_node:
        type: str
        required: false
        description: "PVE node the CT is created on. Computed default: the collection variable lxc_node."
      lxc_semaphore_vmid:
        type: int
        required: false
        default: 0
        description: "CT id (VMID) for the Semaphore container. Required in practice: lxc_guest refuses 0; the inventory sets it."
      lxc_semaphore_hostname:
        type: str
        required: false
        default: "semaphore"
        description: "Hostname of the CT; also its key in the play inventory."
      lxc_semaphore_template_version:
        type: str
        required: false
        default: "0.1.0"
        description: >-
          This repository's release of the semaphore template (the manifest's lxc_template_version, X.Y.Z):
          names the artifact and the tag; server refuses a guest baked at another.
      lxc_semaphore_template_file:
        type: str
        required: false
        description: "File name of the released template. Computed default: debian-13-semaphore_<version>_<arch>.tar.zst."
      lxc_semaphore_template:
        type: str
        required: false
        description: "storage:vztmpl/<file> of the released semaphore template. Computed default: local:vztmpl/<template_file>."
      lxc_semaphore_template_url:
        type: str
        required: false
        description: >-
          Where lxc_guest fetches the template when it is not in the node's cache.
          Computed default: <lxc_template_release_base>/semaphore/v<version>/<template_file>, the GitHub Release asset.
      lxc_semaphore_template_checksum:
        type: str
        required: false
        default: ""
        description: "sha256:<hex> of the released template (from its .sha256), pinned in the inventory. Required for a fetch; an empty value is refused."
      lxc_semaphore_storage:
        type: str
        required: false
        description: "Storage for the CT rootfs. Computed default: the collection variable lxc_storage."
      lxc_semaphore_rootfs_gb:
        type: int
        required: false
        default: 8
      lxc_semaphore_cores:
        type: int
        required: false
        default: 2
      lxc_semaphore_memory_mb:
        type: int
        required: false
        default: 1024
      lxc_semaphore_net0:
        type: str
        required: false
        description: "Full Proxmox net0 spec. Computed default: DHCP on the collection variable lxc_bridge."
      lxc_semaphore_nameserver:
        type: str
        required: false
        default: ""
      lxc_semaphore_features:
        type: list
        elements: str
        required: false
        default: ["nesting=1"]
        description: "Container features; nesting=1 because Debian 13's systemd 257 needs it. The CT stays unprivileged."
      lxc_semaphore_onboot:
        type: bool
        required: false
        default: true
      lxc_semaphore_pool:
        type: str
        required: false
        default: ""
      lxc_semaphore_group:
        type: str
        required: false
        default: semaphore
        description: "Play-inventory group the running CT is added to."
  bake:
    short_description: "Bake the Semaphore image content into a build rootfs (chroot-safe; no configuration, no start)."
    description:
      - >-
        Runs inside the build rootfs over community.general.chroot, from
        playbooks/bake-template.yml. Installs the tools Semaphore's tasks shell
        out to and the unprivileged service user, downloads the official .deb
        and refuses it unless it carries the pinned checksum, installs it,
        writes the systemd unit and its multi-user.target.wants link.
        Everything site-specific is left to server.
    options:
      lxc_semaphore_version:
        type: str
        required: false
        default: "2.19.16"
        description: "Semaphore release to bake; names the template and the package."
      lxc_semaphore_arch:
        type: str
        required: false
        default: "amd64"
      lxc_semaphore_release_base:
        type: str
        required: false
        default: "https://github.com/semaphoreui/semaphore/releases/download"
      lxc_semaphore_package_file:
        type: str
        required: false
        description: "The .deb asset name. Computed default: semaphore_<version>_linux_<arch>.deb."
      lxc_semaphore_package_url:
        type: str
        required: false
        description: "Computed default: <release_base>/v<version>/<package_file>."
      lxc_semaphore_package_checksum:
        type: str
        required: false
        default: "sha256:56c4ac99b712b3fde11a7d600a0789870a3b945bab0c12f41d91864e0aeb85b8"
        description: "The .deb's sha256 from the release's checksums.txt; a package without it is refused."
      lxc_semaphore_bake_packages:
        type: list
        elements: str
        required: false
        default: [ca-certificates, git, openssh-client, sshpass, rsync, ansible-core]
        description: "Debian packages baked in beside Semaphore: what its tasks shell out to."
      lxc_semaphore_stage_dir:
        type: str
        required: false
        default: "/var/tmp/semaphore-bake"
      lxc_semaphore_user:
        type: str
        required: false
        default: "semaphore"
      lxc_semaphore_home:
        type: str
        required: false
        default: "/var/lib/semaphore"
      lxc_semaphore_config_dir:
        type: str
        required: false
        default: "/etc/semaphore"
      lxc_semaphore_tmp_path:
        type: str
        required: false
        default: "/var/lib/semaphore/tmp"
      lxc_semaphore_config_file:
        type: str
        required: false
        default: "/etc/semaphore/config.json"
      lxc_semaphore_bin:
        type: str
        required: false
        default: "/usr/bin/semaphore"
  server:
    short_description: "Configure and start Semaphore inside a CT created from the released template."
    description:
      - >-
        Runs inside the CT (over proxmox_pct_remote). Refuses a guest without
        the lxc_guest baseline marker or without the semaphore template marker
        at this role's version, writes config.json (SQLite, the port, the
        three keys), applies the database migrations, creates the
        administrator when absent, enables and starts the baked unit, and
        verifies the API. It installs nothing: the package and the unit come
        from the template.
    options:
      lxc_semaphore_template_version:
        type: str
        required: false
        default: "0.1.0"
        description: >-
          This repository's release of the semaphore template (the manifest's lxc_template_version, X.Y.Z):
          names the artifact and the tag; server refuses a guest baked at another.
      lxc_semaphore_version:
        type: str
        required: false
        default: "2.19.16"
        description: "The release the template must carry; server refuses another."
      lxc_semaphore_user:
        type: str
        required: false
        default: "semaphore"
      lxc_semaphore_home:
        type: str
        required: false
        default: "/var/lib/semaphore"
      lxc_semaphore_config_file:
        type: str
        required: false
        default: "/etc/semaphore/config.json"
      lxc_semaphore_db_file:
        type: str
        required: false
        default: "/var/lib/semaphore/database.sqlite"
        description: "The SQLite database (Semaphore's sqlite.host)."
      lxc_semaphore_tmp_path:
        type: str
        required: false
        default: "/var/lib/semaphore/tmp"
        description: "Where Semaphore clones the repositories it runs (its tmp_path)."
      lxc_semaphore_bin:
        type: str
        required: false
        default: "/usr/bin/semaphore"
      lxc_semaphore_port:
        type: int
        required: false
        default: 3000
      lxc_semaphore_interface:
        type: str
        required: false
        default: ""
        description: "Address the server binds; empty for every interface."
      lxc_semaphore_web_host:
        type: str
        required: false
        default: ""
        description: "The URL users reach the UI at when it sits behind a reverse proxy (web_host); empty otherwise."
      lxc_semaphore_non_admin_can_create_project:
        type: bool
        required: false
        default: false
      lxc_semaphore_extra_config:
        type: dict
        required: false
        default: {}
        description: "Further config.json keys, deep-merged over the ones this role writes."
      lxc_semaphore_baseline_marker:
        type: str
        required: false
        description: "Marker lxc_guest's baseline writes. Computed default: the collection variable lxc_baseline_marker_path."
      lxc_semaphore_template_marker:
        type: str
        required: false
        description: "Marker the bake writes (name, version, base). Computed default: the collection variable lxc_template_marker_path."
      lxc_semaphore_admin_login:
        type: str
        required: false
        default: "admin"
      lxc_semaphore_admin_name:
        type: str
        required: false
        default: "Semaphore Admin"
      lxc_semaphore_admin_email:
        type: str
        required: false
        default: "admin@localhost"
      lxc_semaphore_admin_password:
        type: str
        required: false
        default: ""
        description: "SECRET. The administrator's initial password; required. Set once, managed in the UI afterwards."
      lxc_semaphore_cookie_hash:
        type: str
        required: false
        default: ""
        description: "SECRET. Session cookie signing key, base64 of 32 random bytes; required."
      lxc_semaphore_cookie_encryption:
        type: str
        required: false
        default: ""
        description: "SECRET. Session cookie encryption key, base64 of 32 random bytes; required."
      lxc_semaphore_access_key_encryption:
        type: str
        required: false
        default: ""
        description: "SECRET. Key the stored access keys are encrypted with, base64 of 32 random bytes; required and never to be rotated casually."
  remove:
    short_description: "Tear the Semaphore LXC down through lxc_guest (opt-in: lxc_guest_confirm_destroy=true)."
    description:
      - "Placement inputs as for container; only node, vmid and hostname decide which CT is destroyed."
    options:
      lxc_semaphore_node:
        type: str
        required: false
      lxc_semaphore_vmid:
        type: int
        required: false
        default: 0
      lxc_semaphore_hostname:
        type: str
        required: false
        default: "semaphore"

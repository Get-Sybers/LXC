---
# Runs INSIDE the build rootfs over the chroot connection (playbooks/
# bake-template.yml). Everything that is image content and nothing that is site
# state: no configuration, no database, no administrator, no service start. The
# unit is enabled by creating the multi-user.target.wants link directly —
# exactly what `systemctl enable` does for WantedBy=multi-user.target — because
# systemd is not running in a chroot.
- name: "bake | Install the tools Semaphore and its tasks shell out to"
  ansible.builtin.apt:
    name: "{{ lxc_semaphore_bake_packages }}"
    state: present
    update_cache: true
- name: "bake | The unprivileged service user"
  ansible.builtin.user:
    name: "{{ lxc_semaphore_user }}"
    home: "{{ lxc_semaphore_home }}"
    system: true
    create_home: true
    shell: /usr/sbin/nologin
- name: "bake | The configuration directory (root-owned; the service only reads it)"
  ansible.builtin.file:
    path: "{{ lxc_semaphore_config_dir }}"
    state: directory
    owner: root
    group: "{{ lxc_semaphore_user }}"
    mode: "0750"
- name: "bake | The data and working directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lxc_semaphore_user }}"
    group: "{{ lxc_semaphore_user }}"
    mode: "0750"
  loop:
    - "{{ lxc_semaphore_home }}"
    - "{{ lxc_semaphore_tmp_path }}"
- name: "bake | The staging directory"
  ansible.builtin.file:
    path: "{{ lxc_semaphore_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: "bake | Download the Semaphore package and verify it against the pinned checksum"
  ansible.builtin.get_url:
    url: "{{ lxc_semaphore_package_url }}"
    dest: "{{ lxc_semaphore_stage_dir }}/{{ lxc_semaphore_package_file }}"
    checksum: "{{ lxc_semaphore_package_checksum }}"
    owner: root
    group: root
    mode: "0644"
- name: "bake | Install the package"
  ansible.builtin.apt:
    deb: "{{ lxc_semaphore_stage_dir }}/{{ lxc_semaphore_package_file }}"
- name: "bake | Read the installed version"
  ansible.builtin.command:
    argv: ["{{ lxc_semaphore_bin }}", version]
  register: __lxc_semaphore_installed
  changed_when: false
- name: "bake | The installed binary is the pinned release"
  ansible.builtin.assert:
    that: (__lxc_semaphore_installed.stdout | trim) is match('^' ~ (lxc_semaphore_version | regex_escape) ~ '(-|$)')
    fail_msg: >-
      {{ lxc_semaphore_bin }} reports '{{ __lxc_semaphore_installed.stdout | trim }}',
      not {{ lxc_semaphore_version }}: the package at {{ lxc_semaphore_package_url }}
      is not the release the manifest names.
    quiet: true
- name: "bake | Install the semaphore systemd unit"
  ansible.builtin.template:
    src: semaphore.service.j2
    dest: /etc/systemd/system/semaphore.service
    owner: root
    group: root
    mode: "0644"
- name: "bake | The multi-user.target.wants directory"
  ansible.builtin.file:
    path: /etc/systemd/system/multi-user.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "bake | Enable the unit for multi-user.target"
  ansible.builtin.file:
    src: /etc/systemd/system/semaphore.service
    dest: /etc/systemd/system/multi-user.target.wants/semaphore.service
    state: link
    owner: root
    group: root
- name: "bake | Remove the staging directory"
  ansible.builtin.file:
    path: "{{ lxc_semaphore_stage_dir }}"
    state: absent

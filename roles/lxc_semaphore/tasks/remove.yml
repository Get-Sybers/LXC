---
# Node side, opt-in. lxc_guest refuses without lxc_guest_confirm_destroy=true
# on the command line and refuses a CT that is not the one described here.
- name: "remove | Destroy the Semaphore LXC through lxc_guest"
  ansible.builtin.include_role:
    name: get_sybers.lxc.lxc_guest
    tasks_from: remove
  vars:
    lxc_guest_node: "{{ lxc_semaphore_node }}"
    lxc_guest_vmid: "{{ lxc_semaphore_vmid }}"
    lxc_guest_hostname: "{{ lxc_semaphore_hostname }}"
    lxc_guest_template: "{{ lxc_semaphore_template }}"
    lxc_guest_net0: "{{ lxc_semaphore_net0 }}"

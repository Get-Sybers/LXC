---
# Node side. The container's whole lifecycle is lxc_guest's; this file only
# names the Semaphore placement. The vars are scoped to this include (standards
# §5: a runtime temporary, not configuration — the configuration is the
# lxc_semaphore_* inputs in the inventory).
- name: "container | Ensure the Semaphore LXC through lxc_guest"
  ansible.builtin.include_role:
    name: get_sybers.lxc.lxc_guest
  vars:
    lxc_guest_node: "{{ lxc_semaphore_node }}"
    lxc_guest_vmid: "{{ lxc_semaphore_vmid }}"
    lxc_guest_hostname: "{{ lxc_semaphore_hostname }}"
    lxc_guest_purpose: "Semaphore UI (semaphore.service)"
    lxc_guest_template: "{{ lxc_semaphore_template }}"
    lxc_guest_template_image: "{{ lxc_semaphore_template_image }}"
    lxc_guest_template_url: "{{ lxc_semaphore_template_url }}"
    lxc_guest_template_checksum: "{{ lxc_semaphore_template_checksum }}"
    lxc_guest_storage: "{{ lxc_semaphore_storage }}"
    lxc_guest_rootfs_gb: "{{ lxc_semaphore_rootfs_gb }}"
    lxc_guest_cores: "{{ lxc_semaphore_cores }}"
    lxc_guest_memory_mb: "{{ lxc_semaphore_memory_mb }}"
    lxc_guest_net0: "{{ lxc_semaphore_net0 }}"
    lxc_guest_nameserver: "{{ lxc_semaphore_nameserver }}"
    lxc_guest_features: "{{ lxc_semaphore_features }}"
    lxc_guest_onboot: "{{ lxc_semaphore_onboot }}"
    lxc_guest_pool: "{{ lxc_semaphore_pool }}"
    lxc_guest_group: "{{ lxc_semaphore_group }}"

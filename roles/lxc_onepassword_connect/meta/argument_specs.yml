---
argument_specs:
  container:
    short_description: "Ensure the Connect LXC on the node through lxc_guest and add it to the play inventory."
    description:
      - >-
        Runs on the Proxmox node (hosts: localhost, connection: local). Hands
        this role's placement inputs to get_sybers.lxc.lxc_guest, which
        preflights, creates, starts, waits for and add_hosts the container into
        lxc_onepassword_connect_group over proxmox_pct_remote.
    options:
      lxc_onepassword_connect_node:
        type: str
        required: false
        description: "PVE node the CT is created on. Computed default: the collection variable lxc_node."
      lxc_onepassword_connect_vmid:
        type: int
        required: false
        default: 0
        description: "CT id (VMID) for the Connect container. Required in practice: lxc_guest refuses 0; the inventory sets it."
      lxc_onepassword_connect_hostname:
        type: str
        required: false
        default: "op-connect"
        description: "Hostname of the CT; also its key in the play inventory."
      lxc_onepassword_connect_template_version:
        type: str
        required: false
        default: "0.1.1"
        description: >-
          This repository's release of the op-connect template (the manifest's lxc_template_version, X.Y.Z):
          names the artifact and the tag; server refuses a guest baked at another.
      lxc_onepassword_connect_template_name:
        type: str
        required: false
        description: "The template's package/image name under the registry (the GHCR repo path)."
      lxc_onepassword_connect_template_registry_base:
        type: str
        required: false
        description: "Registry the OCI image is pulled from. Computed default: lxc_template_registry_base, else ghcr.io/get-sybers/lxc."
      lxc_onepassword_connect_template_image:
        type: str
        required: false
        description: >-
          GHCR OCI image ref pulled with Proxmox's OCI support; preferred over the release URL.
          Computed default: <registry_base>/<name>:v<version>. Pin @sha256:<digest> for an exact image.
      lxc_onepassword_connect_template_file:
        type: str
        required: false
        description: "File name of the released template. Computed default: debian-13-op-connect_<version>_<arch>.tar.zst."
      lxc_onepassword_connect_template:
        type: str
        required: false
        description: "storage:vztmpl/<file> of the released op-connect template. Computed default: local:vztmpl/<template_file>."
      lxc_onepassword_connect_template_url:
        type: str
        required: false
        description: >-
          Where lxc_guest fetches the template when it is not in the node's cache.
          Computed default: <lxc_template_release_base>/op-connect/v<version>/<template_file>, the GitHub Release asset.
      lxc_onepassword_connect_template_checksum:
        type: str
        required: false
        default: ""
        description: "sha256:<hex> of the released template (from its .sha256), pinned in the inventory. Required for a fetch; an empty value is refused."
      lxc_onepassword_connect_storage:
        type: str
        required: false
        description: "Storage for the CT rootfs. Computed default: the collection variable lxc_storage."
      lxc_onepassword_connect_rootfs_gb:
        type: int
        required: false
        default: 4
      lxc_onepassword_connect_cores:
        type: int
        required: false
        default: 1
      lxc_onepassword_connect_memory_mb:
        type: int
        required: false
        default: 512
      lxc_onepassword_connect_net0:
        type: str
        required: false
        description: "Full Proxmox net0 spec. Computed default: DHCP on the collection variable lxc_bridge."
      lxc_onepassword_connect_nameserver:
        type: str
        required: false
        default: ""
      lxc_onepassword_connect_features:
        type: list
        elements: str
        required: false
        default: ["nesting=1"]
        description: "Container features; nesting=1 because Debian 13's systemd 257 needs it. The CT stays unprivileged."
      lxc_onepassword_connect_firewall_allow:
        type: list
        elements: dict
        required: false
        default: []
        description: "Inbound ports the per-guest firewall opens (default-deny otherwise); passed to lxc_guest."
        options:
          proto:
            type: str
            required: false
            default: tcp
          port:
            type: int
            required: true
          comment:
            type: str
            required: false
      lxc_onepassword_connect_onboot:
        type: bool
        required: false
        default: true
      lxc_onepassword_connect_pool:
        type: str
        required: false
        default: ""
      lxc_onepassword_connect_group:
        type: str
        required: false
        default: onepassword_connect
        description: "Play-inventory group the running CT is added to."
  bake:
    short_description: "Bake the Connect image content into a build rootfs (chroot-safe; no credentials, no start)."
    description:
      - >-
        Runs inside the build rootfs over community.general.chroot, from
        playbooks/bake-template.yml. Installs ca-certificates and the unprivileged
        service user, extracts connect-api/connect-sync from their pinned images
        via the registry API, writes the two systemd units and their
        multi-user.target.wants links. Everything site-specific is left to server.
    options:
      lxc_onepassword_connect_user:
        type: str
        required: false
        default: "opuser"
      lxc_onepassword_connect_home:
        type: str
        required: false
        default: "/home/opuser"
      lxc_onepassword_connect_data_dir:
        type: str
        required: false
        default: "/home/opuser/.op/data"
      lxc_onepassword_connect_bin_dir:
        type: str
        required: false
        default: "/usr/local/bin"
      lxc_onepassword_connect_api_port:
        type: int
        required: false
        default: 8080
      lxc_onepassword_connect_stage_dir:
        type: str
        required: false
        default: "/var/tmp/op-connect-extract"
      lxc_onepassword_connect_version:
        type: str
        required: false
        default: "1.8.3"
      lxc_onepassword_connect_arch:
        type: str
        required: false
        default: "amd64"
      lxc_onepassword_connect_registry:
        type: str
        required: false
        default: "registry-1.docker.io"
      lxc_onepassword_connect_auth_url:
        type: str
        required: false
        default: "https://auth.docker.io/token"
      lxc_onepassword_connect_repos:
        type: list
        elements: str
        required: false
        default: ["1password/connect-api", "1password/connect-sync"]
  server:
    short_description: "Configure and start Connect inside a CT created from the released template."
    description:
      - >-
        Runs inside the CT (over proxmox_pct_remote). Refuses a guest without the
        lxc_guest baseline marker or without the op-connect template marker at
        this role's version, drops the credentials file under the service user's
        ~/.op, enables and starts the baked units, and verifies the API. It
        installs nothing: the binaries and units come from the template.
    options:
      lxc_onepassword_connect_template_version:
        type: str
        required: false
        default: "0.1.1"
        description: >-
          This repository's release of the op-connect template (the manifest's lxc_template_version, X.Y.Z):
          names the artifact and the tag; server refuses a guest baked at another.
      lxc_onepassword_connect_user:
        type: str
        required: false
        default: "opuser"
      lxc_onepassword_connect_home:
        type: str
        required: false
        default: "/home/opuser"
      lxc_onepassword_connect_data_dir:
        type: str
        required: false
        default: "/home/opuser/.op/data"
      lxc_onepassword_connect_bin_dir:
        type: str
        required: false
        default: "/usr/local/bin"
      lxc_onepassword_connect_api_port:
        type: int
        required: false
        default: 8080
      lxc_onepassword_connect_stage_dir:
        type: str
        required: false
        default: "/var/tmp/op-connect-extract"
      lxc_onepassword_connect_version:
        type: str
        required: false
        default: "1.8.3"
        description: "Connect image tag to pin (confirm the current tag on Docker Hub)."
      lxc_onepassword_connect_arch:
        type: str
        required: false
        default: "amd64"
      lxc_onepassword_connect_registry:
        type: str
        required: false
        default: "registry-1.docker.io"
      lxc_onepassword_connect_auth_url:
        type: str
        required: false
        default: "https://auth.docker.io/token"
      lxc_onepassword_connect_repos:
        type: list
        elements: str
        required: false
        default: ["1password/connect-api", "1password/connect-sync"]
      lxc_onepassword_connect_baseline_marker:
        type: str
        required: false
        description: "Marker lxc_guest's baseline writes. Computed default: the collection variable lxc_baseline_marker_path."
      lxc_onepassword_connect_template_marker:
        type: str
        required: false
        description: "Marker the bake writes (name, version, base). Computed default: the collection variable lxc_template_marker_path."
      lxc_onepassword_connect_credentials_src:
        type: str
        required: false
        default: ""
        description: "Path on the node to the 1password-credentials.json (SECRET; required for server)."
  remove:
    short_description: "Tear the Connect LXC down through lxc_guest (opt-in: lxc_guest_confirm_destroy=true)."
    description:
      - "Placement inputs as for container; only node, vmid and hostname decide which CT is destroyed."
    options:
      lxc_onepassword_connect_node:
        type: str
        required: false
      lxc_onepassword_connect_vmid:
        type: int
        required: false
        default: 0
      lxc_onepassword_connect_hostname:
        type: str
        required: false
        default: "op-connect"

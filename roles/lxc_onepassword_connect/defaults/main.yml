---
# --- Placement of the Connect LXC (per site; see README) -------------------
# Handed to lxc_guest by container.yml / remove.yml. The node defaults to the
# collection variable the inventory defines (standards §4d).
lxc_onepassword_connect_node: "{{ lxc_node }}"
# The CT id: required, no safe default. lxc_guest refuses 0; the inventory
# (group_vars/all/onepassword.yml) sets it.
lxc_onepassword_connect_vmid: 0
lxc_onepassword_connect_hostname: op-connect
# The released op-connect template (templates/op-connect, built and published
# by .github/workflows/templates.yml). lxc_guest fetches it into the node's
# template cache by checksum when it is not there; the checksum is pinned in
# the inventory from the release, and an empty one is refused.
# This repository's release of the op-connect template (templates/op-connect/
# template.yml sets the same X.Y.Z for the bake): it names the artifact, the
# release tag and the template marker, and server refuses a guest baked at
# another. Raised with every change to the image; the service version below
# is what the image carries.
lxc_onepassword_connect_template_version: "0.1.1"
lxc_onepassword_connect_template_file: >-
  debian-13-op-connect_{{ lxc_onepassword_connect_template_version }}_{{ lxc_onepassword_connect_arch }}.tar.zst
lxc_onepassword_connect_template: "local:vztmpl/{{ lxc_onepassword_connect_template_file }}"
lxc_onepassword_connect_template_url: >-
  {{ lxc_template_release_base }}/op-connect/v{{ lxc_onepassword_connect_template_version }}/{{ lxc_onepassword_connect_template_file }}
lxc_onepassword_connect_template_checksum: ""
lxc_onepassword_connect_storage: "{{ lxc_storage }}"
lxc_onepassword_connect_rootfs_gb: 4
lxc_onepassword_connect_cores: 1
lxc_onepassword_connect_memory_mb: 512
# Full Proxmox net0 string. DHCP on the mgmt bridge by default; for a static
# address use e.g. "name=eth0,bridge=vmbr0,ip=192.0.2.150/24,gw=192.0.2.1".
lxc_onepassword_connect_net0: "name=eth0,bridge={{ lxc_bridge }},ip=dhcp"
lxc_onepassword_connect_nameserver: ""
# Debian 13's systemd 257 needs nested namespaces; the CT stays unprivileged.
lxc_onepassword_connect_features: ["nesting=1"]
lxc_onepassword_connect_onboot: true
lxc_onepassword_connect_pool: ""
# The play-inventory group the running CT is added to (the guest-side plays
# target it).
lxc_onepassword_connect_group: onepassword_connect

# --- Connect version + source images -----------------------------------------
# The version and arch name the released template; templates/op-connect/
# template.yml sets the same values for the bake, so the image and the deploy
# agree. Confirm the current tag on Docker Hub before raising it.
lxc_onepassword_connect_version: "1.8.3"
lxc_onepassword_connect_arch: amd64
lxc_onepassword_connect_registry: registry-1.docker.io
lxc_onepassword_connect_auth_url: "https://auth.docker.io/token"
lxc_onepassword_connect_repos:
  - 1password/connect-api
  - 1password/connect-sync

# --- Service layout inside the CT (matches the official image) ---
lxc_onepassword_connect_user: opuser
lxc_onepassword_connect_home: /home/opuser
lxc_onepassword_connect_data_dir: "{{ lxc_onepassword_connect_home }}/.op/data"
lxc_onepassword_connect_bin_dir: /usr/local/bin
lxc_onepassword_connect_api_port: 8080
# Inbound ports the per-guest firewall opens (default-deny otherwise).
lxc_onepassword_connect_firewall_allow:
  - { proto: tcp, port: "{{ lxc_onepassword_connect_api_port }}", comment: "Connect API" }
lxc_onepassword_connect_stage_dir: /var/tmp/op-connect-extract
# The markers server asserts before configuring anything: the baseline
# lxc_guest writes and the template marker the bake writes.
lxc_onepassword_connect_baseline_marker: "{{ lxc_baseline_marker_path }}"
lxc_onepassword_connect_template_marker: "{{ lxc_template_marker_path }}"

# --- The 1password-credentials.json (SECRET): path on the node ---
lxc_onepassword_connect_credentials_src: ""

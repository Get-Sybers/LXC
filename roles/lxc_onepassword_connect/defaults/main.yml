---
# --- Placement of the Connect LXC (per site; see README) -------------------
# Handed to lxc_guest by container.yml / remove.yml. The node defaults to the
# collection variable the inventory defines (standards §4d).
lxc_onepassword_connect_node: "{{ lxc_node }}"
lxc_onepassword_connect_vmid: 950
lxc_onepassword_connect_hostname: op-connect
lxc_onepassword_connect_template: "{{ lxc_template }}"
lxc_onepassword_connect_storage: "{{ lxc_storage }}"
lxc_onepassword_connect_rootfs_gb: 4
lxc_onepassword_connect_cores: 1
lxc_onepassword_connect_memory_mb: 512
# Full Proxmox net0 string. DHCP on the mgmt bridge by default; for a static
# address use e.g. "name=eth0,bridge=vmbr0,ip=192.168.4.150/24,gw=192.168.4.1".
lxc_onepassword_connect_net0: "name=eth0,bridge={{ lxc_bridge }},ip=dhcp"
lxc_onepassword_connect_nameserver: ""
# Debian 13's systemd 257 needs nested namespaces; the CT stays unprivileged.
lxc_onepassword_connect_features: ["nesting=1"]
lxc_onepassword_connect_onboot: true
lxc_onepassword_connect_pool: ""
# The play-inventory group the running CT is added to (the guest-side plays
# target it).
lxc_onepassword_connect_group: onepassword_connect

# --- Connect version + source images (pin; confirm the current tag on Docker Hub) ---
lxc_onepassword_connect_version: "1.8.3"
lxc_onepassword_connect_arch: amd64
lxc_onepassword_connect_registry: registry-1.docker.io
lxc_onepassword_connect_auth_url: "https://auth.docker.io/token"
lxc_onepassword_connect_repos:
  - 1password/connect-api
  - 1password/connect-sync

# --- Service layout inside the CT (matches the official image) ---
lxc_onepassword_connect_user: opuser
lxc_onepassword_connect_home: /home/opuser
lxc_onepassword_connect_data_dir: "{{ lxc_onepassword_connect_home }}/.op/data"
lxc_onepassword_connect_bin_dir: /usr/local/bin
lxc_onepassword_connect_api_port: 8080
lxc_onepassword_connect_stage_dir: /var/tmp/op-connect-extract
# The baseline marker lxc_guest writes; server refuses a guest without it.
lxc_onepassword_connect_baseline_marker: "{{ lxc_baseline_marker_path }}"

# --- The 1password-credentials.json (SECRET): path on the node ---
lxc_onepassword_connect_credentials_src: ""

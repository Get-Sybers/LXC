---
# Runs INSIDE the running CT over proxmox_pct_remote. The image content is
# already there (tasks/bake.yml, in the released template); this does the
# site-specific rest: the credentials file, the first start, the health check.
- name: "server | Stat the lxc_guest baseline marker"
  ansible.builtin.stat:
    path: "{{ lxc_onepassword_connect_baseline_marker }}"
  register: __lxc_onepassword_connect_baseline
- name: "server | Refuse a guest that has not been through the hardened baseline"
  ansible.builtin.assert:
    that: __lxc_onepassword_connect_baseline.stat.exists
    fail_msg: >-
      {{ lxc_onepassword_connect_baseline_marker }} is absent, so this guest has
      not been through get_sybers.lxc.lxc_guest's baseline (no SSH daemon, no
      container runtime). The released op-connect template carries it; a guest
      created from anything else is not configured by this role.
    quiet: true
- name: "server | Read the template marker"
  ansible.builtin.slurp:
    src: "{{ lxc_onepassword_connect_template_marker }}"
  register: __lxc_onepassword_connect_tmpl
  failed_when: false
- name: "server | Parse the template marker"
  ansible.builtin.set_fact:
    __lxc_onepassword_connect_tmpl_fields: >-
      {{ dict((__lxc_onepassword_connect_tmpl.content | default('') | b64decode).splitlines()
              | select('search', '=') | map('split', '=', 1) | list) }}
- name: "server | Refuse a guest that was not created from the op-connect template"
  ansible.builtin.assert:
    that:
      - __lxc_onepassword_connect_tmpl_fields['name'] | default('') == 'op-connect'
      - __lxc_onepassword_connect_tmpl_fields['version'] | default('') == lxc_onepassword_connect_template_version | string
      - __lxc_onepassword_connect_tmpl_fields['service'] | default('') == lxc_onepassword_connect_version | string
    fail_msg: >-
      {{ lxc_onepassword_connect_template_marker }} says
      name={{ __lxc_onepassword_connect_tmpl_fields['name'] | default('<absent>') }}
      version={{ __lxc_onepassword_connect_tmpl_fields['version'] | default('<absent>') }}
      service={{ __lxc_onepassword_connect_tmpl_fields['service'] | default('<absent>') }};
      this role configures op-connect {{ lxc_onepassword_connect_version }} from
      template release {{ lxc_onepassword_connect_template_version }}. The
      Connect binaries are baked into the released template (templates/op-connect),
      never installed into a running guest. Create the CT from the matching
      release, or set lxc_onepassword_connect_version to the one it carries.
    quiet: true
- name: "server | Stat the baked binaries"
  ansible.builtin.stat:
    path: "{{ lxc_onepassword_connect_bin_dir }}/{{ item | basename }}"
  register: __lxc_onepassword_connect_bins
  loop: "{{ lxc_onepassword_connect_repos }}"
- name: "server | The baked binaries are present"
  ansible.builtin.assert:
    that: __lxc_onepassword_connect_bins.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Missing under {{ lxc_onepassword_connect_bin_dir }}:
      {{ __lxc_onepassword_connect_bins.results | rejectattr('stat.exists') | map(attribute='item') | list }}.
      The template marker matched but the image is incomplete — rebuild and re-release it.
    quiet: true
- name: "server | A credentials file must have been provided"
  ansible.builtin.assert:
    that: lxc_onepassword_connect_credentials_src | length > 0
    fail_msg: >-
      lxc_onepassword_connect_credentials_src is empty — set it to the path of
      the 1password-credentials.json you downloaded when creating the Connect server.
    quiet: true
- name: "server | Install the 1password-credentials.json (secret)"
  ansible.builtin.copy:
    src: "{{ lxc_onepassword_connect_credentials_src }}"
    dest: "{{ lxc_onepassword_connect_home }}/.op/1password-credentials.json"
    owner: "{{ lxc_onepassword_connect_user }}"
    group: "{{ lxc_onepassword_connect_user }}"
    mode: "0600"
  no_log: true
  notify: Restart 1Password Connect
- name: "server | Confirm the credentials file landed (shape only)"
  ansible.builtin.stat:
    path: "{{ lxc_onepassword_connect_home }}/.op/1password-credentials.json"
  register: __lxc_onepassword_connect_cred
- name: "server | Report credentials SHAPE only (never contents)"
  ansible.builtin.assert:
    that:
      - __lxc_onepassword_connect_cred.stat.exists
      - (__lxc_onepassword_connect_cred.stat.size | default(0)) > 0
    fail_msg: "1password-credentials.json is missing or empty inside the container."
    success_msg: >-
      1password-credentials.json present
      ({{ __lxc_onepassword_connect_cred.stat.size | default(0) }} bytes).
    quiet: true
- name: "server | Enable and start op-connect-sync"
  ansible.builtin.systemd_service:
    name: op-connect-sync
    enabled: true
    state: started
    daemon_reload: true
- name: "server | Enable and start op-connect-api"
  ansible.builtin.systemd_service:
    name: op-connect-api
    enabled: true
    state: started
    daemon_reload: true
- name: "server | Apply any pending restart before verifying"
  ansible.builtin.meta: flush_handlers
- name: "server | Verify the API answers"
  ansible.builtin.include_tasks: verify.yml

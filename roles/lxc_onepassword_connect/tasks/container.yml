---
# Node side. The container's whole lifecycle is lxc_guest's; this file only
# names the Connect placement. The vars are scoped to this include (standards
# §5: a runtime temporary, not configuration — the configuration is the
# lxc_onepassword_connect_* inputs in the inventory).
- name: "container | Ensure the Connect LXC through lxc_guest"
  ansible.builtin.include_role:
    name: get_sybers.lxc.lxc_guest
  vars:
    lxc_guest_node: "{{ lxc_onepassword_connect_node }}"
    lxc_guest_vmid: "{{ lxc_onepassword_connect_vmid }}"
    lxc_guest_hostname: "{{ lxc_onepassword_connect_hostname }}"
    lxc_guest_purpose: "1Password Connect server (op-connect-api + op-connect-sync)"
    lxc_guest_template: "{{ lxc_onepassword_connect_template }}"
    lxc_guest_storage: "{{ lxc_onepassword_connect_storage }}"
    lxc_guest_rootfs_gb: "{{ lxc_onepassword_connect_rootfs_gb }}"
    lxc_guest_cores: "{{ lxc_onepassword_connect_cores }}"
    lxc_guest_memory_mb: "{{ lxc_onepassword_connect_memory_mb }}"
    lxc_guest_net0: "{{ lxc_onepassword_connect_net0 }}"
    lxc_guest_nameserver: "{{ lxc_onepassword_connect_nameserver }}"
    lxc_guest_features: "{{ lxc_onepassword_connect_features }}"
    lxc_guest_onboot: "{{ lxc_onepassword_connect_onboot }}"
    lxc_guest_pool: "{{ lxc_onepassword_connect_pool }}"
    lxc_guest_group: "{{ lxc_onepassword_connect_group }}"

---
- name: "verify | Probe the Connect API health endpoint"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ lxc_onepassword_connect_api_port }}/health"
    method: GET
    status_code: [200]
    return_content: true
  register: __lxc_onepassword_connect_verify
  until: (__lxc_onepassword_connect_verify.status | default(-1)) == 200
  retries: 15
  delay: 2
  changed_when: false
  check_mode: false
  failed_when: false
- name: "verify | Assert op-connect-api is healthy"
  ansible.builtin.assert:
    that:
      - (__lxc_onepassword_connect_verify.status | default(-1)) == 200
      - (__lxc_onepassword_connect_verify.json.name | default('')) == '1Password Connect API'
    fail_msg: >-
      op-connect-api did not become healthy at
      http://127.0.0.1:{{ lxc_onepassword_connect_api_port }}/health
      (status {{ __lxc_onepassword_connect_verify.status | default(-1) }},
      answered by '{{ __lxc_onepassword_connect_verify.json.name | default('nothing') }}').
      connect-sync serves /health too, so a 200 alone proves nothing: if sync
      answered, it holds the API port. Inspect `journalctl -u op-connect-api
      -u op-connect-sync` inside the container.
    success_msg: >-
      op-connect-api {{ __lxc_onepassword_connect_verify.json.version | default('?') }} is healthy
      (HTTP 200 at /health, dependencies:
      {{ __lxc_onepassword_connect_verify.json.dependencies | default([]) | map(attribute='status') | list | join(', ') }}).
    quiet: true
- name: "verify | Read the guest's address on its net0 interface"
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - -o
      - addr
      - show
      - dev
      - "{{ (lxc_onepassword_connect_net0 | string) | regex_search('(?:^|,)name=([^,]+)', '\\1') | default(['eth0'], true) | first }}"
  register: __lxc_onepassword_connect_addr
  changed_when: false
  check_mode: false
  failed_when: false
- name: "verify | Remember where Connect answers on the network"
  ansible.builtin.set_fact:
    lxc_onepassword_connect_url: >-
      {{ 'http://' ~ ((__lxc_onepassword_connect_addr.stdout | default('')) | regex_search('inet ([0-9.]+)/', '\1')
                      | default([''], true) | first) ~ ':' ~ lxc_onepassword_connect_api_port }}
- name: "verify | The guest has an address on net0"
  ansible.builtin.assert:
    that: lxc_onepassword_connect_url is not match('^http://:')
    fail_msg: >-
      net0 has no IPv4 address inside the guest
      ({{ __lxc_onepassword_connect_addr.stdout | default('nothing reported') | trim }}):
      DHCP or the static address did not come up, so nothing outside the guest can
      reach Connect. The deploy play proves the network path next; fix the guest's
      network first.
    success_msg: "Connect answers inside the guest; on the network it is {{ lxc_onepassword_connect_url }} (proven by the deploy play's last play)."
    quiet: true

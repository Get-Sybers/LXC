---
- name: "Ensure gpg and the keyrings directory are present"
  ansible.builtin.apt:
    name: [gpg, ca-certificates]
    state: present
    update_cache: true
- name: "The apt keyrings directory"
  ansible.builtin.file:
    path: "{{ lxc_elastic_repo_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "Download Elastic's package signing key"
  ansible.builtin.get_url:
    url: "{{ lxc_elastic_repo_key_url }}"
    dest: "{{ lxc_elastic_repo_keyring }}"
    owner: root
    group: root
    mode: "0644"
- name: "Read the key's fingerprint"
  ansible.builtin.command:
    argv: [gpg, --batch, --with-colons, --show-keys, "{{ lxc_elastic_repo_keyring }}"]
  register: __lxc_elastic_repo_keyinfo
  changed_when: false
- name: "Refuse a key that does not carry Elastic's published fingerprint"
  ansible.builtin.assert:
    that: >-
      __lxc_elastic_repo_keyinfo.stdout_lines | select('match', '^fpr:')
      | map('regex_replace', '^fpr:+([0-9A-F]+):.*$', '\\1') | list
      is contains(lxc_elastic_repo_key_fingerprint | upper)
    fail_msg: >-
      The key at {{ lxc_elastic_repo_key_url }} does not carry fingerprint
      {{ lxc_elastic_repo_key_fingerprint }}. Refusing to trust it for package
      installs; compare against https://www.elastic.co/guide/en/elasticsearch/reference/current/deb.html.
    quiet: true
- name: "Write the Elastic apt source (deb822)"
  ansible.builtin.template:
    src: elastic.sources.j2
    dest: "/etc/apt/sources.list.d/elastic-{{ lxc_elastic_repo_major }}.sources"
    owner: root
    group: root
    mode: "0644"
- name: "Refresh the apt cache for the new source (a bake runs once, in a fresh rootfs)"
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

---
# Node side. The container's whole lifecycle is lxc_guest's; this file only
# names the GHOSTS placement. The vars are scoped to this include (standards §5:
# a runtime temporary, not configuration — the configuration is the lxc_ghost9_*
# inputs in the inventory).
- name: "container | Ensure the GHOSTS LXC through lxc_guest"
  ansible.builtin.include_role:
    name: get_sybers.lxc.lxc_guest
  vars:
    lxc_guest_node: "{{ lxc_ghost9_node }}"
    lxc_guest_vmid: "{{ lxc_ghost9_vmid }}"
    lxc_guest_hostname: "{{ lxc_ghost9_hostname }}"
    lxc_guest_purpose: "GHOSTS NPC-simulation server (ghosts-api / nginx / n8n / grafana)"
    lxc_guest_template: "{{ lxc_ghost9_template }}"
    lxc_guest_template_url: "{{ lxc_ghost9_template_url }}"
    lxc_guest_template_checksum: "{{ lxc_ghost9_template_checksum }}"
    lxc_guest_storage: "{{ lxc_ghost9_storage }}"
    lxc_guest_rootfs_gb: "{{ lxc_ghost9_rootfs_gb }}"
    lxc_guest_cores: "{{ lxc_ghost9_cores }}"
    lxc_guest_memory_mb: "{{ lxc_ghost9_memory_mb }}"
    lxc_guest_swap_mb: "{{ lxc_ghost9_swap_mb }}"
    lxc_guest_net0: "{{ lxc_ghost9_net0 }}"
    lxc_guest_nameserver: "{{ lxc_ghost9_nameserver }}"
    lxc_guest_features: "{{ lxc_ghost9_features }}"
    lxc_guest_onboot: "{{ lxc_ghost9_onboot }}"
    lxc_guest_pool: "{{ lxc_ghost9_pool }}"
    lxc_guest_group: "{{ lxc_ghost9_group }}"

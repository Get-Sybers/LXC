---
# Health probes from inside the CT (loopback). The API's /test endpoint does a
# real DB round-trip, so it verifies the API and PostgreSQL together; the first
# start seeds the schema (~15-30s), so it is retried.
- name: "verify | Probe the GHOSTS API /test (API + DB)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ lxc_ghost9_api_port }}/test"
    method: GET
    status_code: [200]
  register: __lxc_ghost9_api_probe
  until: (__lxc_ghost9_api_probe.status | default(-1)) == 200
  retries: 40
  delay: 5
  changed_when: false
  check_mode: false
  failed_when: false
- name: "verify | Probe the supporting services"
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    status_code: [200]
  register: __lxc_ghost9_svc_probe
  until: (__lxc_ghost9_svc_probe.status | default(-1)) == 200
  retries: 20
  delay: 3
  changed_when: false
  check_mode: false
  failed_when: false
  loop:
    - { name: UI, url: "http://127.0.0.1:{{ lxc_ghost9_ui_port }}/" }
    - { name: n8n, url: "http://127.0.0.1:{{ lxc_ghost9_n8n_port }}/healthz" }
    - { name: grafana, url: "http://127.0.0.1:{{ lxc_ghost9_grafana_port }}/api/health" }
  loop_control:
    label: "{{ item.name }}"
- name: "verify | Assert the GHOSTS stack is healthy"
  ansible.builtin.assert:
    that:
      - (__lxc_ghost9_api_probe.status | default(-1)) == 200
      - __lxc_ghost9_svc_probe.results | map(attribute='status') | select('ne', 200) | list | length == 0
    fail_msg: >-
      The GHOSTS stack is not fully healthy. API /test
      = {{ __lxc_ghost9_api_probe.status | default('n/a') }};
      {% for r in __lxc_ghost9_svc_probe.results %}{{ r.item.name }}={{ r.status | default('n/a') }} {% endfor %}.
      Inspect `journalctl -u ghosts-api -u ghosts-n8n -u grafana-server -u nginx` inside the CT.
    success_msg: "GHOSTS is healthy — API/DB, UI, n8n and Grafana all answer."
    quiet: true

---
# Runs INSIDE the running CT over proxmox_pct_remote. The image content is
# already baked (tasks/bake.yml); this does the site-specific rest: the firewall
# drop-in, the Postgres role/db, the config that carries the public hostname and
# the secrets, the ordered start of all five services, the n8n provisioning and
# the health check.
- name: "server | Stat the lxc_guest baseline marker"
  ansible.builtin.stat:
    path: "{{ lxc_ghost9_baseline_marker }}"
  register: __lxc_ghost9_baseline
- name: "server | Refuse a guest that has not been through the hardened baseline"
  ansible.builtin.assert:
    that: __lxc_ghost9_baseline.stat.exists
    fail_msg: >-
      {{ lxc_ghost9_baseline_marker }} is absent, so this guest has not been
      through get_sybers.lxc.lxc_guest's baseline (no SSH daemon, no container
      runtime). The released ghost9 template carries it; a guest created from
      anything else is not configured by this role.
    quiet: true
- name: "server | Open the service ports in the in-guest firewall"
  ansible.builtin.template:
    src: nftables-allow.nft.j2
    dest: /etc/nftables.d/10-ghost9.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables
  when: lxc_ghost9_firewall_allow | length > 0
- name: "server | Read the template marker"
  ansible.builtin.slurp:
    src: "{{ lxc_ghost9_template_marker }}"
  register: __lxc_ghost9_tmpl
  failed_when: false
- name: "server | Parse the template marker"
  ansible.builtin.set_fact:
    __lxc_ghost9_tmpl_fields: >-
      {{ dict((__lxc_ghost9_tmpl.content | default('') | b64decode).splitlines()
              | select('search', '=') | map('split', '=', 1) | list) }}
- name: "server | Refuse a guest that was not created from the ghost9 template"
  ansible.builtin.assert:
    that:
      - __lxc_ghost9_tmpl_fields['name'] | default('') == 'ghost9'
      - __lxc_ghost9_tmpl_fields['version'] | default('') == lxc_ghost9_template_version | string
      - __lxc_ghost9_tmpl_fields['service'] | default('') == lxc_ghost9_version | string
    fail_msg: >-
      {{ lxc_ghost9_template_marker }} says
      name={{ __lxc_ghost9_tmpl_fields['name'] | default('<absent>') }}
      version={{ __lxc_ghost9_tmpl_fields['version'] | default('<absent>') }}
      service={{ __lxc_ghost9_tmpl_fields['service'] | default('<absent>') }};
      this role configures GHOSTS {{ lxc_ghost9_version }} from template release
      {{ lxc_ghost9_template_version }}. The stack is baked into the released
      template (templates/ghost9), never installed into a running guest. Create
      the CT from the matching release.
    quiet: true
- name: "server | Stat the baked artifacts"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __lxc_ghost9_artifacts
  loop:
    - "{{ lxc_ghost9_api_root }}/ghosts.api.dll"
    - "{{ lxc_ghost9_ui_root }}/index.html"
    - /usr/bin/n8n
    - /usr/bin/dotnet
  loop_control:
    label: "{{ item }}"
- name: "server | The baked stack is present"
  ansible.builtin.assert:
    that: __lxc_ghost9_artifacts.results | map(attribute='stat.exists') | select('false') | list | length == 0
    fail_msg: >-
      A baked artifact is missing (API dll, UI, n8n or dotnet). The template
      marker matched but the image is incomplete — rebuild and re-release it.
    quiet: true
- name: "server | The DB password and the n8n owner password must have been provided"
  ansible.builtin.assert:
    that:
      - lxc_ghost9_db_password | length > 0
      - lxc_ghost9_n8n_owner_email | length > 0
      - lxc_ghost9_n8n_owner_password | length > 0
    fail_msg: >-
      lxc_ghost9_db_password, lxc_ghost9_n8n_owner_email and
      lxc_ghost9_n8n_owner_password must be set: pass the vaulted
      inventory/secrets/ghost9.yml with -e (inventory/secrets/README.md shows them).
    quiet: true
  no_log: true

# --- PostgreSQL role + database ---------------------------------------------
- name: "server | Ensure PostgreSQL is running"
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started
- name: "server | Does the ghosts DB role exist?"
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -tAc, "SELECT 1 FROM pg_roles WHERE rolname='{{ lxc_ghost9_db_user }}'"]
  register: __lxc_ghost9_role
  changed_when: false
- name: "server | Create the ghosts DB role (secret: password)"
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -c
      - "CREATE ROLE {{ lxc_ghost9_db_user }} LOGIN PASSWORD '{{ lxc_ghost9_db_password | replace(\"'\", \"''\") }}'"
  when: __lxc_ghost9_role.stdout | trim != "1"
  changed_when: true
  no_log: true
- name: "server | Keep the ghosts role password in sync with the secret"
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -c
      - "ALTER ROLE {{ lxc_ghost9_db_user }} PASSWORD '{{ lxc_ghost9_db_password | replace(\"'\", \"''\") }}'"
  changed_when: false
  no_log: true
- name: "server | Does the ghosts database exist?"
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -tAc, "SELECT 1 FROM pg_database WHERE datname='{{ lxc_ghost9_db_name }}'"]
  register: __lxc_ghost9_db
  changed_when: false
- name: "server | Create the ghosts database"
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -c, "CREATE DATABASE {{ lxc_ghost9_db_name }} OWNER {{ lxc_ghost9_db_user }}"]
  when: __lxc_ghost9_db.stdout | trim != "1"
  changed_when: true

# --- Site configuration (carries the public hostname and the secrets) -------
- name: "server | Write the API environment file (secret: the DB password)"
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/ghost9/api.env
    owner: root
    group: "{{ lxc_ghost9_api_user }}"
    mode: "0640"
  no_log: true
  notify: Restart ghosts-api
- name: "server | The UI assets directory"
  ansible.builtin.file:
    path: "{{ lxc_ghost9_ui_root }}/assets"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "server | Write the UI runtime config (browser-facing URLs)"
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ lxc_ghost9_ui_root }}/assets/config.json"
    owner: root
    group: root
    mode: "0644"
- name: "server | Write the Grafana datasource (secret: the DB password)"
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/ghost9.yml
    owner: root
    group: grafana
    mode: "0640"
  no_log: true
  notify: Restart grafana

# --- Start the supporting services, then provision n8n, then the API --------
- name: "server | Enable and start the supporting services"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - ghosts-n8n
    - grafana-server
    - nginx
- name: "server | Apply the firewall reload and any pending restarts"
  ansible.builtin.meta: flush_handlers

# --- Ollama: install, start, pull the model, lock down networking ------------
- name: "server | Ensure zstd is present to extract the Ollama binary and model archive (.tar.zst)"
  when: lxc_ghost9_ollama_enabled
  block:
    - name: "server | Is zstd already present (baked into the template image)?"
      ansible.builtin.command:
        argv: [dpkg-query, -W, -f, '${Status}', zstd]
      register: __lxc_ghost9_zstd_check
      changed_when: false
      failed_when: false
    - name: "server | Install zstd from the apt proxy when the template does not carry it"
      when: "'install ok installed' not in (__lxc_ghost9_zstd_check.stdout | default(''))"
      block:
        - name: "server | An apt proxy is required: an isolated range has no public Debian mirror"
          ansible.builtin.assert:
            that: lxc_ghost9_apt_proxy_base | length > 0
            fail_msg: >-
              zstd is not present in this template image and
              lxc_ghost9_apt_proxy_base is unset, so there is no reachable Debian
              mirror to install it from (the range CT reaches only the range).
              Bake zstd into the template, or set lxc_ghost9_apt_proxy_base to the
              range's Nexus apt proxy base (e.g. http://<nexus>:8081/repository).
            quiet: true
        - name: "server | Read the guest's distro codename for the apt suite"
          ansible.builtin.slurp:
            src: /etc/os-release
          register: __lxc_ghost9_osrelease
        - name: "server | Derive the apt suite from the codename"
          ansible.builtin.set_fact:
            __lxc_ghost9_apt_suite: >-
              {{ ((__lxc_ghost9_osrelease.content | b64decode).splitlines()
                  | select('match', 'VERSION_CODENAME=') | list | first | default(''))
                 | split('=') | last }}
        - name: "server | The codename was read"
          ansible.builtin.assert:
            that: __lxc_ghost9_apt_suite | length > 0
            fail_msg: >-
              Could not read VERSION_CODENAME from the guest's /etc/os-release to
              build the apt suite for the Nexus Debian proxy.
            quiet: true
        - name: "server | A one-line apt list pointing only at the range Debian proxy"
          ansible.builtin.copy:
            dest: /etc/apt/ghost9-zstd.list
            owner: root
            group: root
            mode: "0644"
            content: >
              deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg]
              {{ lxc_ghost9_apt_proxy_base }}/{{ lxc_ghost9_apt_debian_repo }}
              {{ __lxc_ghost9_apt_suite }} {{ lxc_ghost9_apt_components }}
        - name: "server | Refresh apt metadata from the range proxy only (not the template's public mirrors)"
          ansible.builtin.command:
            argv:
              - apt-get
              - -o
              - Dir::Etc::sourcelist=/etc/apt/ghost9-zstd.list
              - -o
              - Dir::Etc::sourceparts=/dev/null
              - -o
              - APT::Get::List-Cleanup=0
              - update
          changed_when: true
        - name: "server | Install zstd from the range proxy"
          ansible.builtin.command:
            argv:
              - apt-get
              - -o
              - Dir::Etc::sourcelist=/etc/apt/ghost9-zstd.list
              - -o
              - Dir::Etc::sourceparts=/dev/null
              - install
              - -y
              - zstd
          changed_when: true
- name: "server | Preflight: CT memory for the Ollama model"
  ansible.builtin.command:
    argv: [grep, MemTotal, /proc/meminfo]
  register: __lxc_ghost9_memtotal
  changed_when: false
  when: lxc_ghost9_ollama_enabled
- name: "server | CT needs sufficient memory for the Ollama model"
  ansible.builtin.assert:
    that: (__lxc_ghost9_memtotal.stdout | regex_search('(\d+)') | int) >= 16777216
    fail_msg: >-
      This CT has {{ (__lxc_ghost9_memtotal.stdout | regex_search('(\d+)') | int) // 1024 }}MB
      RAM. Large Ollama models need much more (gemma4:31b ~48GB, gemma4:12b
      ~16GB). Raise lxc_ghost9_memory_mb in the inventory.
    quiet: true
  when: lxc_ghost9_ollama_enabled
- name: "server | Rootfs should be large enough for the model archive"
  ansible.builtin.assert:
    that: lxc_ghost9_rootfs_gb | int >= 40
    fail_msg: >-
      lxc_ghost9_rootfs_gb is {{ lxc_ghost9_rootfs_gb }}. The model archive
      is downloaded and extracted in place, so the CT needs at least double the
      archive size plus headroom (~50GB for gemma4:31b). Raise
      lxc_ghost9_rootfs_gb in the inventory.
    quiet: true
  when: lxc_ghost9_ollama_enabled and lxc_ghost9_ollama_model_archive | default('') | length > 0
- name: "server | The Ollama release checksum must be pinned"
  ansible.builtin.assert:
    that: lxc_ghost9_ollama_checksum | length > 0
    fail_msg: >-
      lxc_ghost9_ollama_checksum is empty. Pin it to the sha256 of
      ollama-linux-{{ lxc_ghost9_arch }}.tar.zst from the v{{ lxc_ghost9_ollama_version }} release.
    quiet: true
  when: lxc_ghost9_ollama_enabled
- name: "server | Check if Ollama is already installed"
  ansible.builtin.stat:
    path: /usr/local/bin/ollama
  register: __lxc_ghost9_ollama_bin
  when: lxc_ghost9_ollama_enabled
- name: "server | Download, extract and clean up Ollama"
  when: lxc_ghost9_ollama_enabled and not (__lxc_ghost9_ollama_bin.stat.exists | default(false))
  block:
    - name: "server | Download the Ollama release tarball"
      ansible.builtin.get_url:
        url: "{{ lxc_ghost9_ollama_url }}"
        dest: "/var/tmp/ollama.tar.zst"
        checksum: "{{ lxc_ghost9_ollama_checksum }}"
        owner: root
        group: root
        mode: "0644"
    - name: "server | Extract the Ollama release"
      ansible.builtin.command:
        argv: [tar, --zstd, -xf, /var/tmp/ollama.tar.zst, -C, /usr/local]
      changed_when: true
    - name: "server | Remove the Ollama tarball"
      ansible.builtin.file:
        path: /var/tmp/ollama.tar.zst
        state: absent
- name: "server | The Ollama service user"
  ansible.builtin.user:
    name: "{{ lxc_ghost9_ollama_user }}"
    home: "{{ lxc_ghost9_ollama_home }}"
    system: true
    create_home: true
    shell: /usr/sbin/nologin
  when: lxc_ghost9_ollama_enabled
- name: "server | Ollama data directory"
  ansible.builtin.file:
    path: "{{ lxc_ghost9_ollama_home }}"
    state: directory
    owner: "{{ lxc_ghost9_ollama_user }}"
    group: "{{ lxc_ghost9_ollama_user }}"
    mode: "0750"
  when: lxc_ghost9_ollama_enabled
- name: "server | Install the Ollama systemd unit"
  ansible.builtin.template:
    src: ollama.service.j2
    dest: /etc/systemd/system/ollama.service
    owner: root
    group: root
    mode: "0644"
  when: lxc_ghost9_ollama_enabled
  notify: Restart ollama
- name: "server | Enable and start Ollama"
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: started
    daemon_reload: true
  when: lxc_ghost9_ollama_enabled
- name: "server | Wait for Ollama to accept connections"
  ansible.builtin.wait_for:
    host: "{{ lxc_ghost9_ollama_host }}"
    port: "{{ lxc_ghost9_ollama_port }}"
    timeout: 30
  when: lxc_ghost9_ollama_enabled
- name: "server | Load the Ollama model from the local archive"
  when: lxc_ghost9_ollama_enabled and lxc_ghost9_ollama_model_archive | default('') | length > 0
  block:
    - name: "server | Download the model archive from Nexus"
      ansible.builtin.get_url:
        url: "{{ lxc_ghost9_ollama_model_archive }}"
        dest: /var/tmp/ollama-model.tar.zst
        owner: root
        group: root
        mode: "0644"
    - name: "server | Extract the model archive into the Ollama data directory"
      ansible.builtin.command:
        argv: [tar, --zstd, -xf, /var/tmp/ollama-model.tar.zst, -C, "{{ lxc_ghost9_ollama_home }}"]
      args:
        creates: "{{ lxc_ghost9_ollama_home }}/models/manifests"
    - name: "server | Fix model directory ownership"
      ansible.builtin.file:
        path: "{{ lxc_ghost9_ollama_home }}/models"
        state: directory
        owner: "{{ lxc_ghost9_ollama_user }}"
        group: "{{ lxc_ghost9_ollama_user }}"
        recurse: true
    - name: "server | Remove the model archive"
      ansible.builtin.file:
        path: /var/tmp/ollama-model.tar.zst
        state: absent
- name: "server | Pull the Ollama model from the registry ({{ lxc_ghost9_ollama_model }})"
  ansible.builtin.command:
    argv: [ollama, pull, "{{ lxc_ghost9_ollama_model }}"]
  register: __lxc_ghost9_ollama_pull
  changed_when: "'up to date' not in (__lxc_ghost9_ollama_pull.stderr | default('') ~ __lxc_ghost9_ollama_pull.stdout | default(''))"
  environment:
    OLLAMA_HOST: "{{ lxc_ghost9_ollama_host }}:{{ lxc_ghost9_ollama_port }}"
  async: 1800
  poll: 30
  when: lxc_ghost9_ollama_enabled and lxc_ghost9_ollama_model_archive | default('') | length == 0
- name: "server | Ollama lockdown drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: lxc_ghost9_ollama_enabled
- name: "server | Lock Ollama to loopback after the model pull"
  ansible.builtin.template:
    src: ollama-lockdown.conf.j2
    dest: /etc/systemd/system/ollama.service.d/10-lockdown.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart ollama
  when: lxc_ghost9_ollama_enabled

- name: "server | Provision n8n (owner, workflows, API key)"
  ansible.builtin.include_tasks: provision_n8n.yml
- name: "server | Enable and start the GHOSTS API"
  ansible.builtin.systemd_service:
    name: ghosts-api
    enabled: true
    state: started
    daemon_reload: true
- name: "server | Apply any pending API restart before verifying"
  ansible.builtin.meta: flush_handlers
- name: "server | Verify the stack answers"
  ansible.builtin.include_tasks: verify.yml

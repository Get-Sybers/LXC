---
# Runs INSIDE the build rootfs over the chroot connection (playbooks/
# bake-template.yml). Everything that is image content and nothing that is site
# state: no DB role, no configuration carrying the public hostname or secrets,
# no service start. Units are enabled by creating the multi-user.target.wants
# links directly (what `systemctl enable` does) because systemd is not running
# in a chroot. GHOSTS runs as native services — no Docker — so the lxc_guest
# baseline's container-runtime refusal still holds.

# --- Third-party apt repositories (signed-by their keys) --------------------
- name: "bake | Install the prerequisites for adding signed apt repositories"
  ansible.builtin.apt:
    name: [ca-certificates, curl, gpg, apt-transport-https]
    state: present
    update_cache: true
- name: "bake | Download the Microsoft .NET feed config package"
  ansible.builtin.get_url:
    url: "{{ lxc_ghost9_microsoft_prod_deb_url }}"
    dest: /var/tmp/packages-microsoft-prod.deb
    owner: root
    group: root
    mode: "0644"
- name: "bake | Install the Microsoft .NET feed (repo + signing key)"
  ansible.builtin.apt:
    deb: /var/tmp/packages-microsoft-prod.deb
- name: "bake | The apt keyring directory"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "bake | Fetch each repository signing key (armoured)"
  ansible.builtin.get_url:
    url: "{{ item['value']['key_url'] }}"
    dest: "/etc/apt/keyrings/ghost9-{{ item['key'] }}.asc"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ lxc_ghost9_apt_repos | dict2items }}"
  loop_control:
    label: "{{ item['key'] }}"
- name: "bake | Dearmour each key"
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - "-o"
      - "/etc/apt/keyrings/ghost9-{{ item['key'] }}.gpg"
      - "/etc/apt/keyrings/ghost9-{{ item['key'] }}.asc"
    creates: "/etc/apt/keyrings/ghost9-{{ item['key'] }}.gpg"
  loop: "{{ lxc_ghost9_apt_repos | dict2items }}"
  loop_control:
    label: "{{ item['key'] }}"
- name: "bake | Declare each repository (signed-by)"
  ansible.builtin.copy:
    content: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/ghost9-{{ item['key'] }}.gpg]
      {{ item['value']['uri'] }} {{ item['value']['suite'] }} {{ item['value']['components'] }}

    dest: "/etc/apt/sources.list.d/ghost9-{{ item['key'] }}.list"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ lxc_ghost9_apt_repos | dict2items }}"
  loop_control:
    label: "{{ item['key'] }}"

# --- Packages: distro base + Node 22 + .NET 10 SDK + Grafana ----------------
- name: "bake | Install the base packages, Node.js, the .NET SDK and Grafana"
  ansible.builtin.apt:
    name: "{{ lxc_ghost9_bake_packages + ['nodejs', lxc_ghost9_dotnet_sdk_package] }}"
    state: present
    update_cache: true
- name: "bake | Install the pinned n8n from npm (global)"
  ansible.builtin.command:
    argv: [npm, install, "--global", "n8n@{{ lxc_ghost9_n8n_version }}"]
    creates: /usr/lib/node_modules/n8n/bin/n8n
  environment:
    npm_config_cache: /var/cache/lxc-build/npm

# --- Service users + directories --------------------------------------------
- name: "bake | The API service user"
  ansible.builtin.user:
    name: "{{ lxc_ghost9_api_user }}"
    home: "{{ lxc_ghost9_root }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
- name: "bake | The n8n service user"
  ansible.builtin.user:
    name: "{{ lxc_ghost9_n8n_user }}"
    home: "{{ lxc_ghost9_n8n_home }}"
    system: true
    create_home: true
    shell: /usr/sbin/nologin
- name: "bake | Application and data directories"
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: directory
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"
  loop:
    - { path: "{{ lxc_ghost9_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ lxc_ghost9_api_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ lxc_ghost9_ui_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ lxc_ghost9_n8n_workflows_dir }}", owner: "{{ lxc_ghost9_n8n_user }}", group: "{{ lxc_ghost9_n8n_user }}", mode: "0750" }
    - { path: "/etc/ghost9", owner: root, group: root, mode: "0755" }
    - { path: "{{ lxc_ghost9_stage_dir }}", owner: root, group: root, mode: "0700" }
    - { path: /var/cache/lxc-build/nuget, owner: root, group: root, mode: "0777" }
    - { path: /var/cache/lxc-build/npm, owner: root, group: root, mode: "0777" }
  loop_control:
    label: "{{ item['path'] }}"

# --- GHOSTS source (checksum-pinned) ----------------------------------------
- name: "bake | Download the GHOSTS source tarball and verify it against the pinned checksum"
  ansible.builtin.get_url:
    url: "{{ lxc_ghost9_source_url }}"
    dest: "{{ lxc_ghost9_stage_dir }}/ghosts-{{ lxc_ghost9_version }}.tar.gz"
    checksum: "{{ lxc_ghost9_source_sha256 }}"
    owner: root
    group: root
    mode: "0644"
- name: "bake | Unpack the GHOSTS source tree"
  ansible.builtin.unarchive:
    src: "{{ lxc_ghost9_stage_dir }}/ghosts-{{ lxc_ghost9_version }}.tar.gz"
    remote_src: true
    dest: "{{ lxc_ghost9_source_root }}"
    creates: "{{ lxc_ghost9_source_dir }}/src"

# --- Build the .NET API -----------------------------------------------------
- name: "bake | Publish the GHOSTS API (.NET {{ lxc_ghost9_dotnet_sdk_package }})"
  ansible.builtin.command:
    argv: [dotnet, publish, "-c", Release, "--disable-build-servers", "-o", "{{ lxc_ghost9_api_root }}"]
    chdir: "{{ lxc_ghost9_source_dir }}/src/Ghosts.Api"
    creates: "{{ lxc_ghost9_api_root }}/ghosts.api.dll"
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_CLI_HOME: "{{ lxc_ghost9_stage_dir }}/dotnet"
    XDG_RUNTIME_DIR: "{{ lxc_ghost9_stage_dir }}"
    HOME: "{{ lxc_ghost9_stage_dir }}"
    NUGET_PACKAGES: /var/cache/lxc-build/nuget
- name: "bake | Copy the full API config tree over the published one (publish omits most of it)"
  ansible.builtin.command:
    argv: [cp, -a, "{{ lxc_ghost9_source_dir }}/src/Ghosts.Api/config/.", "{{ lxc_ghost9_api_root }}/config/"]
    creates: "{{ lxc_ghost9_api_root }}/config/SeedData/seed.json"
- name: "bake | The API log directory (the service user writes NLog here, relative to CWD)"
  ansible.builtin.file:
    path: "{{ lxc_ghost9_api_root }}/logs"
    state: directory
    owner: "{{ lxc_ghost9_api_user }}"
    group: "{{ lxc_ghost9_api_user }}"
    mode: "0755"

# --- Build the Angular UI ---------------------------------------------------
- name: "bake | Install the UI build dependencies (npm ci)"
  ansible.builtin.command:
    argv: [npm, ci]
    chdir: "{{ lxc_ghost9_source_dir }}/src/Ghosts.Frontend"
    creates: "{{ lxc_ghost9_source_dir }}/src/Ghosts.Frontend/node_modules"
  environment:
    npm_config_cache: /var/cache/lxc-build/npm
- name: "bake | Build the UI (production)"
  ansible.builtin.command:
    argv: [npm, run, build, "--", "--configuration", production]
    chdir: "{{ lxc_ghost9_source_dir }}/src/Ghosts.Frontend"
    creates: "{{ lxc_ghost9_source_dir }}/src/Ghosts.Frontend/dist/Ghosts.Frontend/browser/index.html"
  environment:
    npm_config_cache: /var/cache/lxc-build/npm
- name: "bake | Deploy the built UI to the web root"
  ansible.builtin.command:
    argv: [cp, -a, "{{ lxc_ghost9_source_dir }}/src/Ghosts.Frontend/dist/Ghosts.Frontend/browser/.", "{{ lxc_ghost9_ui_root }}/"]
    creates: "{{ lxc_ghost9_ui_root }}/index.html"

# --- n8n workflows + Grafana dashboards (site-independent content) ----------
- name: "bake | Stage the GHOSTS n8n workflows for the provisioner"
  ansible.builtin.command:
    argv: [cp, -a, "{{ lxc_ghost9_source_dir }}/configuration/n8n-workflows/.", "{{ lxc_ghost9_n8n_workflows_dir }}/"]
    creates: "{{ lxc_ghost9_n8n_workflows_dir }}/README.md"
- name: "bake | Install the Grafana dashboards provisioning"
  ansible.builtin.command:
    argv: [cp, -a, "{{ lxc_ghost9_source_dir }}/configuration/grafana/dashboards/.", /etc/grafana/provisioning/dashboards/]
    creates: /etc/grafana/provisioning/dashboards/dashboards.yml

# --- systemd units + nginx site (templated; site values come from server) ---
- name: "bake | Install the ghosts-api systemd unit"
  ansible.builtin.template:
    src: ghosts-api.service.j2
    dest: /etc/systemd/system/ghosts-api.service
    owner: root
    group: root
    mode: "0644"
- name: "bake | Install the ghosts-n8n systemd unit"
  ansible.builtin.template:
    src: ghosts-n8n.service.j2
    dest: /etc/systemd/system/ghosts-n8n.service
    owner: root
    group: root
    mode: "0644"
- name: "bake | Grafana environment drop-in (anonymous admin, embedding)"
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "bake | Grafana override with the GF_ environment"
  ansible.builtin.template:
    src: grafana-override.conf.j2
    dest: /etc/systemd/system/grafana-server.service.d/10-ghost9.conf
    owner: root
    group: root
    mode: "0644"
- name: "bake | Install the nginx site for the UI"
  ansible.builtin.template:
    src: ghost9-nginx.conf.j2
    dest: /etc/nginx/sites-available/ghost9.conf
    owner: root
    group: root
    mode: "0644"
- name: "bake | Disable the default nginx site"
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
- name: "bake | Enable the ghost9 nginx site"
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ghost9.conf
    dest: /etc/nginx/sites-enabled/ghost9.conf
    state: link
    owner: root
    group: root

# --- Enable every service for multi-user.target (chroot-safe) ---------------
- name: "bake | The multi-user.target.wants directory"
  ansible.builtin.file:
    path: /etc/systemd/system/multi-user.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "bake | Enable the ghost9 units"
  ansible.builtin.file:
    src: "/etc/systemd/system/{{ item }}.service"
    dest: "/etc/systemd/system/multi-user.target.wants/{{ item }}.service"
    state: link
    owner: root
    group: root
  loop: [ghosts-api, ghosts-n8n]
- name: "bake | Enable the packaged services (postgresql, nginx, grafana-server)"
  ansible.builtin.file:
    src: "/usr/lib/systemd/system/{{ item }}.service"
    dest: "/etc/systemd/system/multi-user.target.wants/{{ item }}.service"
    state: link
    owner: root
    group: root
    force: true
  loop: [postgresql, nginx, grafana-server]

# --- Trim the image ---------------------------------------------------------
- name: "bake | Shut down transient build servers (so nothing holds the rootfs at seal time)"
  ansible.builtin.command:
    argv: [dotnet, build-server, shutdown]
  environment:
    DOTNET_CLI_HOME: "{{ lxc_ghost9_stage_dir }}/dotnet"
    HOME: "{{ lxc_ghost9_stage_dir }}"
  changed_when: false
  failed_when: false
- name: "bake | Stop any gpg agent spawned during the apt-key import"
  ansible.builtin.command:
    argv: [gpgconf, --kill, all]
  changed_when: false
  failed_when: false
- name: "bake | Remove the source tree and build caches"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lxc_ghost9_source_dir }}"
    - "{{ lxc_ghost9_stage_dir }}"
    - /root/.nuget
    - /root/.dotnet
    - /root/.npm

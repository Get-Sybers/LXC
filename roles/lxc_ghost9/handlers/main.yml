---
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Restart ghosts-api
  ansible.builtin.systemd_service:
    name: ghosts-api
    state: restarted
    daemon_reload: true

- name: Restart ghosts-n8n
  ansible.builtin.systemd_service:
    name: ghosts-n8n
    state: restarted
    daemon_reload: true

- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted

---
- name: "root | Read the effective user"
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", "user"]
  register: __lpf_user
  delegate_to: "{{ lxc_preflight_delegate_to }}"
  delegate_facts: true
- name: "root | Assert running as root"
  ansible.builtin.assert:
    that: __lpf_user['ansible_facts']['ansible_user_uid'] | int == 0
    fail_msg: >-
      The LXC plays run as root on the Proxmox node (uid here:
      {{ __lpf_user['ansible_facts']['ansible_user_uid'] }}): pct is root-only and there is no
      sudo/become path. Re-run as root.
    quiet: true

---
# Constants of the hardened premise (doc/reference/hardened-lxc-premise.md). Not inputs: a guest that needs
# any of these to be different does not belong in this collection.
#
# The ownership marker. create writes it into the container description;
# preflight refuses to touch a CT that exists without it; remove refuses to
# destroy one. Read back through pvesh (decoded), never `pct config`, which
# URL-encodes the description so a ':' can never match.
lxc_guest_description_marker: "Ansible-managed: get_sybers.lxc.lxc_guest"
# Every container is unprivileged. preflight asserts this value is still true
# (an extra-var can override a vars/ constant, which is exactly the override
# preflight exists to refuse).
lxc_guest_unprivileged: true
# Bumped when the baseline changes what it enforces; the marker records it.
lxc_guest_baseline_version: 1
# The guest is reached only through `pct exec` from the node: no SSH daemon.
lxc_guest_baseline_purge_packages:
  - openssh-server
  - openssh-sftp-server
# A container runtime inside the guest would need nesting and a wider syscall
# surface; the premise runs services natively under systemd instead. Presence
# is refused, not removed — it means someone put it there on purpose.
lxc_guest_baseline_forbidden_binaries:
  - /usr/sbin/sshd
  - /usr/bin/docker
  - /usr/bin/dockerd
  - /usr/bin/containerd
  - /usr/bin/podman
  - /usr/bin/nerdctl
  - /usr/bin/lxc-start

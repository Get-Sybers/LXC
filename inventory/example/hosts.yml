---
# The static controlled host set — the ONLY place hosts and their group
# membership are declared (standards §14). Every other value lives in
# group_vars/<group>/<topic>.yml, one file per topic; nothing is hard-coded in
# a play or a role.
#
# This is the template: `make config` copies inventory/example/ into
# inventory/, where the real files are untracked (.gitignore). Nothing here
# needs editing on a clustered node: the node the plays run on is recorded by
# playbooks/preflight.yml in group_vars/all/default.yml (lxc_site.node), and the
# admission gate admits a host that `pvecm nodes` lists.
#
# localhost is declared so the node-side plays (hosts: localhost, run ON the
# node) and the API-client plays receive group_vars/all like any other host —
# the implicit localhost would not.
#
# A node that is not in a cluster is not in `pvecm nodes`; the admission gate
# then admits it by membership of this group. List it here in that case only:
#   proxmox_nodes:
#     hosts:
#       my-standalone-node:
proxmox_nodes:
  hosts: {}
controller:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

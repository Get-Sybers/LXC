---
# GHOSTS ("ghost9") server LXC placement (deploy-ghost9.yml). The DB and n8n
# owner passwords are NOT here — they live in the vaulted
# inventory/secrets/ghost9.yml passed with -e (doc/howto/deploy-ghost9.md).
# Copied into place by `make config`; the copy is untracked.
lxc_ghost9_node: "{{ lxc_node }}"
# A free CT id, cluster-wide (`pvesh get /cluster/resources --type vm` lists the
# taken ones). lxc_guest refuses 0.
lxc_ghost9_vmid: 0
# The guest's net0. DHCP on the management bridge by default; for a fixed
# address: "name=eth0,bridge={{ lxc_bridge }},ip=192.0.2.180/24,gw=192.0.2.1".
lxc_ghost9_net0: "name=eth0,bridge={{ lxc_bridge }},ip=dhcp"
# The hostname or address a browser reaches the UI/API/Grafana/n8n at (fills the
# UI's assets/config.json and the API CORS origins). CHANGE-ME to the CT's DNS
# name or address — the default, the hostname, only resolves where that name does.
lxc_ghost9_public_hostname: "CHANGE-ME"
# Created from the GHCR OCI image ghcr.io/get-sybers/lxc/ghost9, pulled by the
# play with Proxmox's OCI support. Make the package public (or log the node in:
# skopeo login ghcr.io). Pin an exact image with lxc_ghost9_template_image: <ref>@sha256:<digest>.

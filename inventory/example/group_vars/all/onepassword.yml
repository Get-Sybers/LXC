---
# 1Password Connect LXC placement (deploy-onepassword-connect.yml). The
# connection secrets and the items to mirror are NOT here — they live in the
# vaulted inventory/secrets/onepassword.yml passed with -e
# (doc/howto/deploy-onepassword-connect.md). Copied into place by
# `make config`; the copy is untracked.
lxc_onepassword_connect_node: "{{ lxc_node }}"
# A free CT id, cluster-wide (`pvesh get /cluster/resources --type vm` lists
# the taken ones). lxc_guest refuses 0.
lxc_onepassword_connect_vmid: 0
# The guest's net0. DHCP on the management bridge by default; for a fixed
# address: "name=eth0,bridge={{ lxc_bridge }},ip=192.0.2.150/24,gw=192.0.2.1".
lxc_onepassword_connect_net0: "name=eth0,bridge={{ lxc_bridge }},ip=dhcp"
# The released template this CT is created from: the op-connect/v<version>
# GitHub Release (templates/op-connect). lxc_guest fetches it into the node's
# cache by this checksum when it is not there. Pin the value from the release's
# .sha256 asset; an empty checksum refuses the fetch.
lxc_onepassword_connect_template_checksum: ""

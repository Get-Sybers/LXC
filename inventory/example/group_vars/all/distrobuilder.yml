---
# distrobuilder build-box LXC placement (deploy-distrobuilder.yml) and the
# image definitions it holds. There are no secrets. Copied into place by
# `make config`; the copy is untracked.
lxc_distrobuilder_node: "{{ lxc_node }}"
# A free CT id, cluster-wide (`pvesh get /cluster/resources --type vm` lists
# the taken ones). lxc_guest refuses 0.
# A run-time input: -e lxc_distrobuilder_vmid=<id> on the deploy play overrides this; set it
# here to make an id this site's default. 0 is refused.
lxc_distrobuilder_vmid: 0
# The guest's net0. DHCP on the management bridge by default; for a fixed
# address: "name=eth0,bridge={{ lxc_bridge }},ip=192.0.2.170/24,gw=192.0.2.1".
lxc_distrobuilder_net0: "name=eth0,bridge={{ lxc_bridge }},ip=dhcp"
# Created from the GHCR OCI image ghcr.io/get-sybers/lxc/distrobuilder, pulled by the
# play with Proxmox's OCI support. Make the package public (or log the node in:
# skopeo login ghcr.io). Pin an exact image with lxc_distrobuilder_template_image: <ref>@sha256:<digest>.
# The image definitions server places in the CT: {name, src} copies a file
# from this node, {name, url, checksum} fetches one inside the CT by a pinned
# checksum. The lxc/lxc-ci repository's images/*.yaml are the usual sources;
# pin a commit in the URL and `sha256sum` the file for the checksum.
lxc_distrobuilder_definitions: []
#  - name: debian.yaml
#    url: https://raw.githubusercontent.com/lxc/lxc-ci/CHANGE-ME-commit/images/debian.yaml
#    checksum: "sha256:CHANGE-ME"
#  - name: mine.yaml
#    src: /root/distrobuilder/mine.yaml

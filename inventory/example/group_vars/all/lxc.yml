---
# The collection variables every lxc_* role default points at (standards §4d):
# defined once here, overridable per guest through that role's own inputs.
# Copied into place by `make config`; the copy is untracked.

# get_sybers.cluster's single proxmox_config master as seen from here, when the
# shared inventory provides it. proxmox_config is a host_var of the
# proxmox_master and the deploy plays run on localhost, so it is read as a fact
# of that host (hostvars[cluster_master_node]); it is {} when this collection is
# used on its own, so the lxc_site fallbacks below apply. The direction is
# one-way: this collection reads proxmox_config, never the reverse.
lxc_proxmox_config: >-
  {{ hostvars[cluster_master_node]['proxmox_config']
     if (cluster_master_node is defined and cluster_master_node in hostvars
         and 'proxmox_config' in hostvars[cluster_master_node])
     else {} }}
# The node a container is created on unless its role says otherwise. From the
# master's proxmox_config (proxmox_config.node) when the shared inventory is
# present; otherwise the node playbooks/preflight.yml ran on (the As-Is record).
# pct is node-local, so the deploy plays run on it.
lxc_node: "{{ lxc_proxmox_config['node'] | default(lxc_site['node']) }}"
# The template a guest is created from when its role names none. Every service
# role names its own released template (templates/<name>), so this is the
# fallback only; it is fetched into the cache by lxc_guest when a URL and a
# sha256 are set, and never fetched otherwise.
lxc_template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
lxc_template_url: ""
lxc_template_checksum: ""
# Where the `local` storage keeps templates (local:vztmpl/<file>).
lxc_template_cache_dir: /var/lib/vz/template/cache
# Where released templates are fetched from: this repository's GitHub Releases
# (<base>/<name>/v<version>/<file>). Point it at a mirror to serve a lab with
# no reach to github.com.
lxc_template_release_base: https://github.com/get-sybers/lxc/releases/download
# Registry the template OCI images are pulled from; point at a mirror if needed.
lxc_template_registry_base: ghcr.io/get-sybers/lxc
# Rootfs storage for every guest. Deliberately the storage preflight recorded
# (default.yml's rootdir_default), NOT the cluster's guest pool
# (proxmox_config.vm_storage_pool): a container defaults to the node's recorded
# rootfs — a local ZFS or LVM-thin pool, or the shared Ceph pool when that is
# the node default — rather than inheriting the VM guest pool. Name another to
# override the choice.
lxc_storage: "{{ lxc_site['storage']['rootdir_default'] }}"
# The management bridge a guest's net0 sits on by default. From the master's
# proxmox_config (proxmox_config.interface) when the shared inventory is
# present; otherwise the interface that carries the node's default route, as
# preflight recorded it (vmbr0 on a stock Proxmox install).
lxc_bridge: "{{ lxc_proxmox_config['interface'] | default(lxc_site['management']['interface']) }}"
# The Proxmox SDN facts, from the same proxmox_config master: the zone the range
# VNets live in, the VXLAN tag base, and the per-range VNets Ludus hands out
# (number N -> VNet rN) — the declared source of truth a range's VNet is checked
# against. Empty/0 when this collection runs without the cluster inventory, so a
# consumer falls back (e.g. lxc_ghost9_range then checks the node's live SDN).
lxc_sdn_zone: "{{ lxc_proxmox_config['sdn_zone'] | default('') }}"
lxc_vxlan_tag_base: "{{ lxc_proxmox_config['vxlan_tag_base'] | default(0) }}"
lxc_sdn_range_vnets: "{{ lxc_proxmox_config['sdn_range_vnets'] | default([]) }}"
# The marker lxc_guest's baseline writes inside a guest and every service role
# asserts before configuring anything.
lxc_baseline_marker_path: /etc/get-sybers-lxc-baseline
# The marker the bake writes into every released template (name, version,
# base); a service role asserts it before configuring anything.
lxc_template_marker_path: /etc/get-sybers-lxc-template

---
# The collection variables every lxc_* role default points at (standards §4d):
# defined once here, overridable per guest through that role's own inputs.
# Copied into place by `make config`; the copy is untracked.

# The node a container is created on unless its role says otherwise. Membership
# of lxc_hosts in hosts.yml IS the declaration; no other file encodes it.
lxc_node: "{{ groups['lxc_hosts'] | first }}"
# The template a guest is created from when its role names none. Every service
# role names its own released template (templates/<name>), so this is the
# fallback only; it is fetched into the cache by lxc_guest when a URL and a
# sha256 are set, and never fetched otherwise.
lxc_template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
lxc_template_url: ""
lxc_template_checksum: ""
# Where the `local` storage keeps templates (local:vztmpl/<file>).
lxc_template_cache_dir: /var/lib/vz/template/cache
# Where released templates are fetched from: this repository's GitHub Releases
# (<base>/<name>/v<version>/<file>). Point it at a mirror to serve a lab with
# no reach to github.com.
lxc_template_release_base: https://github.com/get-sybers/lxc/releases/download
# Rootfs storage for every guest: `pvesm status` lists yours (the shared
# Ceph pool for HA, a local ZFS or LVM-thin pool otherwise).
lxc_storage: CHANGE-ME
# The management bridge a guest's net0 sits on by default (vmbr0 on a stock
# Proxmox install).
lxc_bridge: vmbr0
# The marker lxc_guest's baseline writes inside a guest and every service role
# asserts before configuring anything.
lxc_baseline_marker_path: /etc/get-sybers-lxc-baseline
# The marker the bake writes into every released template (name, version,
# base); a service role asserts it before configuring anything.
lxc_template_marker_path: /etc/get-sybers-lxc-template

---
# Weekly: raise the pre-commit hook revisions (prek update ->
# .pre-commit-config.yaml) and the collection pins (scripts/upgrade_pins.py ->
# requirements.yml), then open or refresh a single pull request. The bot App
# token is what lets that PR trigger CI.
#
# The pull request is committed and opened with git and the runner's gh (both
# GitHub's own), not peter-evans/create-pull-request: the repository's Actions
# policy admits actions by Get-Sybers, GitHub and Marketplace-verified creators
# only, and that action is none of those. The automation/update-pins branch is
# rebuilt from the current main on every run that finds something to raise.
name: Update pins
on:
  schedule:
    - cron: "20 19 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Mint a bot App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install tooling
        run: |
          python3 -m pip install --user prek==0.5.5 pyyaml==6.0.3 packaging==26.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Update pre-commit hook revisions
        run: prek update
      - name: Raise the requirements.yml pins
        run: python3 scripts/upgrade_pins.py
      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          BASE: ${{ github.ref_name }}
          BRANCH: automation/update-pins
          TITLE: "build(deps): raise pinned linters and collection versions"
        run: |
          git add -- .pre-commit-config.yaml requirements.yml
          if git diff --cached --quiet; then
            echo "every pin is current; nothing to open"
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "users/$bot" --jq .id)"
          git config user.name "$bot"
          git config user.email "$bot_id+$bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit --quiet --message "$TITLE"
          gh auth setup-git
          git push --force origin "$BRANCH"
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          Automated weekly dependency bump:

          - `prek update` — pre-commit hook `rev:` pins in `.pre-commit-config.yaml`
          - `scripts/upgrade_pins.py` — Galaxy/git collection pins in `requirements.yml`

          Run `make conform` before merging.
          BODY
          number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

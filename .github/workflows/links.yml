---
# Nightly lychee run over the whole repository; broken links are reported into
# a single "Link checker report" issue (opened, then updated in place on later
# runs), and the job itself stays green so a transient outage is not recorded
# as a red run.
#
# lychee is installed from its release tarball and verified against the SHA-256
# pinned here, not through lycheeverse/lychee-action: the repository's Actions
# policy admits actions by Get-Sybers, GitHub and Marketplace-verified creators
# only, and lycheeverse is none of those (the action also downloads the same
# tarball, unverified). Raise LYCHEE_VERSION and LYCHEE_SHA256 together; the
# checksum is the release's lychee-x86_64-unknown-linux-gnu.tar.gz.sha256.
name: Links
on:
  schedule:
    - cron: "55 17 * * *"
  workflow_dispatch:
permissions: {}
env:
  LYCHEE_VERSION: "0.24.2"
  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
jobs:
  links:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee (release tarball, checksum pinned)
        working-directory: ${{ runner.temp }}
        run: |
          tarball="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/$tarball"
          echo "$LYCHEE_SHA256  $tarball" | sha256sum -c -
          tar xzf "$tarball" "${tarball%.tar.gz}/lychee"
          sudo install "${tarball%.tar.gz}/lychee" /usr/local/bin/lychee
          lychee --version
      - name: Link checker
        id: lychee
        # lychee exits 2 when it found broken links (the report carries them;
        # the job stays green), 0 when it found none; any other code is lychee
        # itself failing (bad arguments, unreadable config) and is a red run.
        run: |
          code=0
          lychee --no-progress --format markdown --output lychee-report.md . || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - name: Open or update the report issue
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: link-checker
        run: |
          gh label create "$LABEL" --force --color FBCA04 \
            --description "Automated lychee link-check report" >/dev/null 2>&1 || true
          number="$(gh issue list --state open --label "$LABEL" --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "Link checker report" --body-file lychee-report.md
          else
            gh issue create --title "Link checker report" --label "$LABEL" \
              --body-file lychee-report.md
          fi

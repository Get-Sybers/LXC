---
# Bake every LXC template under templates/ and publish one as a GitHub Release.
#
# Pull requests and pushes to main that touch a template, the bake play, a role
# or this workflow bake every template and keep the artifacts for inspection.
# A tag of the form <name>/v<version> (op-connect/v1.8.3) bakes that one
# template and publishes it: the .tar.zst and its .sha256 as release assets, a
# keyless cosign signature bundle beside them, and a GitHub build-provenance
# attestation. The node-side fetch (lxc_guest) verifies the .sha256 the
# inventory pins; `cosign verify-blob` and `gh attestation verify` prove the
# artifact came from this workflow.
name: Templates
on:
  pull_request:
    branches: [main]
    paths:
      - templates/**
      - playbooks/bake-template.yml
      - roles/**
      - requirements.yml
      - .github/workflows/templates.yml
  push:
    branches: [main]
    paths:
      - templates/**
      - playbooks/bake-template.yml
      - roles/**
      - requirements.yml
      - .github/workflows/templates.yml
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      template:
        description: "Template directory name to bake (empty: all)"
        required: false
        default: ""
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ANSIBLE_CORE_PIN: "2.21.5"
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      templates: ${{ steps.pick.outputs.templates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide which templates to bake
        id: pick
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED: ${{ github.event.inputs.template }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            names="${REF_NAME%%/v*}"
          elif [ -n "$REQUESTED" ]; then
            names="$REQUESTED"
          else
            names="$(find templates -mindepth 2 -maxdepth 2 -name template.yml -printf '%h\n' | sed 's#^templates/##' | sort)"
          fi
          for n in $names; do
            [ -f "templates/$n/template.yml" ] || { echo "::error::no such template: $n"; exit 1; }
          done
          echo "templates=$(printf '%s\n' $names | jq -R . | jq -cs .)" | tee -a "$GITHUB_OUTPUT"
  bake:
    needs: plan
    name: bake (${{ matrix.template }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.plan.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the bake toolchain into a venv (root runs it unchanged)
        # The bake needs root (chroot, ownership-preserving tar), so everything it
        # runs lives in one venv and one collections directory that sudo can reach.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zstd
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet "ansible-core==$ANSIBLE_CORE_PIN"
          build/venv/bin/ansible-galaxy collection install -r requirements.yml -p build/collections
          mkdir -p build/collections/ansible_collections/get_sybers
          ln -s "$PWD" build/collections/ansible_collections/get_sybers/lxc
      - name: Bake ${{ matrix.template }}
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          sudo env "ANSIBLE_COLLECTIONS_PATH=$PWD/build/collections" \
            build/venv/bin/ansible-playbook playbooks/bake-template.yml \
            -e "lxc_template_dir=$PWD/templates/$TEMPLATE" -e "lxc_template_workdir=$PWD/build/$TEMPLATE"
          sudo chown -R "$(id -u):$(id -g)" "build/$TEMPLATE"
          cat build/"$TEMPLATE"/*.sha256
      - name: Keep the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.template }}
          path: |
            build/${{ matrix.template }}/*.tar.zst
            build/${{ matrix.template }}/*.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.ref_type == 'tag'
    needs: [plan, bake]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fetch the baked artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the template (keyless, Sigstore)
        run: |
          for f in dist/*.tar.zst; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.zst
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          name="${TAG%%/v*}"; version="${TAG##*/v}"; file="$(basename dist/*.tar.zst)"
          {
            echo "LXC template \`$name\` $version, built by the Templates workflow from \`templates/$name\`."
            echo
            echo "Verify:"
            echo
            echo '```sh'
            echo "sha256sum -c $file.sha256"
            echo "cosign verify-blob --bundle $file.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/$REPO/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com $file"
            echo "gh attestation verify $file -R $REPO"
            echo '```'
            echo
            echo "Pin on the node: \`lxc_${name//-/_}_template_checksum: sha256:<the value in $file.sha256>\`."
          } > notes.md
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --title "$name $version" --notes-file notes.md
          gh release upload "$TAG" -R "$REPO" --clobber dist/*

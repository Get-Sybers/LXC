---
# Bake one LXC template under templates/ and, when asked, publish it as a
# GitHub Release. Manual only: a run is started by hand (workflow_dispatch)
# and the job waits for the `templates` environment's required reviewer before
# it does anything, so nothing is baked or shipped without that approval.
#
# The version is never an input: it is the manifest's lxc_template_version
# (this repository's release of the template, X.Y.Z, raised in the PR that
# changes the image — the Version Gate enforces that), read back from the
# artifact the bake names. A publish creates the <name>/v<version> tag and
# release (the .tar.zst and its .sha256 as assets, a keyless cosign signature
# bundle beside them, a GitHub build-provenance attestation) and refuses a tag
# that already exists: a released template is immutable. A publish runs from
# main only; a bake alone may run from any branch to inspect the artifact. The node-side fetch (lxc_guest)
# verifies the .sha256 the inventory pins; `cosign verify-blob` and
# `gh attestation verify` prove the artifact came from this workflow.
name: Templates
on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template to bake (a directory under templates/)"
        required: true
        type: choice
        options:
          - op-connect
          - semaphore
          - distrobuilder
          - velociraptor
          - ghost9
      publish:
        description: "Publish the bake as the <name>/v<version> GitHub Release (signed, attested; from main only)"
        required: false
        type: boolean
        default: false
permissions: {}
# One bake per template at a time; never cancel a publish mid-flight.
concurrency:
  group: templates-${{ inputs.template }}
  cancel-in-progress: false
env:
  ANSIBLE_CORE_PIN: "2.21.5"
jobs:
  bake:
    name: bake (${{ inputs.template }})
    runs-on: ubuntu-24.04
    environment: templates
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The template exists and a publish runs from main
        env:
          TEMPLATE: ${{ inputs.template }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
        run: |
          test -f "templates/$TEMPLATE/template.yml" || { echo "::error::no such template: $TEMPLATE"; exit 1; }
          if [ "$PUBLISH" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a template is published from main only (dispatched from $REF)"; exit 1
          fi
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the bake toolchain into a venv (root runs it unchanged)
        # The bake needs root (chroot, ownership-preserving tar), so everything it
        # runs lives in one venv and one collections directory that sudo can reach.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zstd
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet "ansible-core==$ANSIBLE_CORE_PIN"
          build/venv/bin/ansible-galaxy collection install -r requirements.yml -p build/collections
          mkdir -p build/collections/ansible_collections/get_sybers
          ln -s "$PWD" build/collections/ansible_collections/get_sybers/lxc
      - name: Restore the NuGet and npm caches for ${{ inputs.template }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ inputs.template }}/depcache
          key: bake-depcache-${{ inputs.template }}-${{ hashFiles(format('templates/{0}/template.yml', inputs.template)) }}
          restore-keys: |
            bake-depcache-${{ inputs.template }}-
      - name: Bake ${{ inputs.template }}
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          sudo env "ANSIBLE_COLLECTIONS_PATH=$PWD/build/collections" \
            build/venv/bin/ansible-playbook playbooks/bake-template.yml \
            -e "lxc_template_dir=$PWD/templates/$TEMPLATE" -e "lxc_template_workdir=$PWD/build/$TEMPLATE" \
            -e "lxc_template_depcache_dir=$PWD/build/$TEMPLATE/depcache"
          sudo chown -R "$(id -u):$(id -g)" "build/$TEMPLATE"
          cat build/"$TEMPLATE"/*.sha256
      # The artifact is <base>-<name>_<version>_<arch>.tar.zst; the version in
      # it is the manifest's X.Y.Z, so the tag follows the manifest and nothing else.
      - name: Resolve the artifact and its version
        id: art
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          file="$(basename build/"$TEMPLATE"/*.tar.zst)"
          version="${file#*_}"; version="${version%_*}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::cannot read a version out of $file"; exit 1; }
          {
            echo "file=$file"
            echo "version=$version"
            echo "tag=$TEMPLATE/v$version"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Baked \`$TEMPLATE\` $version as \`$file\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.template }}
          path: |
            build/${{ inputs.template }}/*.tar.zst
            build/${{ inputs.template }}/*.sha256
          if-no-files-found: error
          retention-days: 14
      # A released template is immutable. If the bake changed on main without
      # the manifest's version moving, this is where the publish fails — raise
      # the version in a PR first, never re-ship an existing one.
      - name: Refuse to overwrite an existing release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.art.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is already released — raise the version in the manifest in a PR before publishing"
            exit 1
          fi
      - name: Install cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the template (keyless, Sigstore)
        if: ${{ inputs.publish }}
        env:
          TEMPLATE: ${{ inputs.template }}
        run: |
          for f in build/"$TEMPLATE"/*.tar.zst; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/${{ inputs.template }}/*.tar.zst
      - name: Publish the GitHub Release (creates the tag)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE: ${{ inputs.template }}
          TAG: ${{ steps.art.outputs.tag }}
          VERSION: ${{ steps.art.outputs.version }}
          FILE: ${{ steps.art.outputs.file }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "LXC template \`$TEMPLATE\` $VERSION, built by the Templates workflow from \`templates/$TEMPLATE\` at $SHA."
            echo
            echo "Verify:"
            echo
            echo '```sh'
            echo "sha256sum -c $FILE.sha256"
            echo "cosign verify-blob --bundle $FILE.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/$REPO/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com $FILE"
            echo "gh attestation verify $FILE -R $REPO"
            echo '```'
            echo
            echo "Pin on the node: \`lxc_${TEMPLATE//-/_}_template_checksum: sha256:<the value in $FILE.sha256>\`."
          } > notes.md
          gh release create "$TAG" -R "$REPO" --target "$SHA" --title "$TEMPLATE $VERSION" --notes-file notes.md \
            build/"$TEMPLATE"/*.tar.zst build/"$TEMPLATE"/*.sha256 build/"$TEMPLATE"/*.sigstore.json
          echo "Published https://github.com/$REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

added:
  - >-
    New ``lxc_ghost9`` role, ``ghost9`` template and ``deploy-ghost9.yml`` play:
    the GHOSTS (CERT/SEI NPC and user-simulation) server as native, sandboxed
    ``systemd`` services in a hardened, in-guest-firewalled, unprivileged LXC —

---
changed:
  - >-
    ``lxc_onepassword_connect`` reads the Connect server's
    ``1password-credentials.json`` from the collection's gitignored secrets
    directory by default: ``lxc_onepassword_connect_credentials_src`` now
    defaults to ``{{ inventory_dir }}/secrets/1password-credentials.json``, so
    the credentials file lives beside the vaulted ``inventory/secrets/onepassword.yml``
    (which already holds the Connect access token) and
    ``deploy-onepassword-connect.yml`` needs nothing on the command line for it.
    ``server`` checks the file is present with a clear message and copies it
    into the guest. ``inventory/secrets/README.md`` documents the file.

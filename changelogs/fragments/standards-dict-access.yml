---
changed:
  - >-
    Loop items are read with bracket notation (``item['key']``, never
    ``item['key']``), as the standard requires: dot access breaks on hyphenated
    keys and collides with the dict methods.
  - >-
    The four ``cp -a`` steps of the ``lxc_ghost9`` bake are argv-form commands
    (no ``cmd`` string), like every other command in the collection.
  - >-
    The ghost9 template is ``0.1.2``: its bake is one of the files this change
    rewrites (bracket reads, argv commands; the image it produces is the same),
    and the Version Gate ships every changed bake as a new, never-published
    version. The deploy pin (``lxc_ghost9_range_template_version``) stays at
    the released ``0.1.1`` until ``0.1.2`` is published.
  - >-
    The Scorecard workflow runs ``ossf/scorecard-action`` v2.5.0, the release
    the proxmaxxing repository's workflow completes with; this repository's
    analysis step had been cancelled by its own 15-minute timeout on every run
    since the repository was created, with the checks themselves finishing in
    seconds when run against it from outside.
  - >-
    ``.github/rulesets/main.json`` requires ``all_green`` (the one CI check,
    as the other repositories do) together with ``lxc-template-pin``; the
    applied ruleset had required the template gate alone, so a red CI run did
    not block a merge.
  - >-
    ``lxc_preflight`` reads the effective uid and the node name from the
    delegate's facts (``setup``, the ``user`` and ``platform`` subsets) instead
    of running ``id -u`` and ``hostname``.
fixed:
  - >-
    The ``lxc_onepassword_connect`` staging rootfs directory declares its owner
    and group as well as its mode.
  - >-
    The project-local collections cache that ansible-lint installs the pinned
    requirements into (``.ansible/``) is excluded from ansible-lint and
    markdownlint, so a local hook run no longer lints the dependencies.

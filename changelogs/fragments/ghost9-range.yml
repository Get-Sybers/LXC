---
added:
  - >-
    ``lxc_ghost9_range`` and ``deploy_ghost9_range.yml`` - the GHOSTS server of one
    Ludus range: ``lxc_ghost9``'s ``container``, ``baseline`` and ``server`` entry
    points placed on the range's VNet (``r<N>``, the VLAN tag,
    ``10.<N>.<vlan>.<octet>/24``, the bridge's MTU) after the range checks
    ``lxc_guest`` does not make and before a placement postcheck through the PVE
    API. Every input is a role default (``lxc_ghost9_range_*``), the play carries no
    variables, and a consumer runs it by its collection-qualified name
    (``ansible-playbook get_sybers.lxc.deploy_ghost9_range -e @<vars file>``);
    ``-t destroy -e lxc_guest_confirm_destroy=true`` tears the CT down.

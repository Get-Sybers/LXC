---
# Deploy the GHOSTS ("ghost9") server of one Ludus range as a hardened Debian LXC
# attached to that range's VNet: lxc_ghost9_range's entry points in order —
# `container` on the node, `baseline` and `server` inside the CT, `remove` on
# `--tags destroy`. Run ON the Proxmox node that hosts the Ludus server, as root.
#
# The file carries underscores so a consumer runs it by its collection-qualified
# name, with every lxc_ghost9_range_* input, the pve_api_* credential and the
# lxc_ghost9 secrets in one vars file:
#
#   ansible-playbook get_sybers.lxc.deploy_ghost9_range -e @/root/.ghost9-range.yml
#
# The CT is not a Ludus range object (`ludus range rm` does not remove it,
# `ludus testing` neither snapshots nor seals it); remove it with
#
#   ansible-playbook get_sybers.lxc.deploy_ghost9_range -e @/root/.ghost9-range.yml \
#     -t destroy -e lxc_guest_confirm_destroy=true
- name: "Create the range's GHOSTS LXC on this node"
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox: &ghost9_range_pve_api
      api_host: "{{ pve_api_host }}"
      api_user: "{{ pve_api_user }}"
      api_token_id: "{{ pve_api_token_id or omit }}"
      api_token_secret: "{{ pve_api_token_secret or omit }}"
      api_password: "{{ pve_api_password or omit }}"
      validate_certs: "{{ pve_validate_certs }}"
  tasks:
    - name: "Range checks, node admission gate, the CT through lxc_ghost9, the placement postcheck"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_ghost9_range
        tasks_from: container
- name: "Harden the guest baseline inside the LXC"
  hosts: ghost9
  gather_facts: false
  tasks:
    - name: "No SSH daemon, no container runtime, baseline marker"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_ghost9_range
        tasks_from: baseline
- name: "Configure and verify the GHOSTS stack inside the LXC"
  hosts: ghost9
  gather_facts: false
  tasks:
    - name: "Firewall, Postgres, site config, start all services, provision n8n, verify"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_ghost9_range
        tasks_from: server
- name: "Tear down the range's GHOSTS LXC (opt-in: --tags destroy -e lxc_guest_confirm_destroy=true)"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [never, destroy]
  module_defaults:
    group/community.proxmox.proxmox: *ghost9_range_pve_api
  tasks:
    - name: "Destroy the range's GHOSTS CT"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_ghost9_range
        tasks_from: remove

---
# Mirror credentials into the self-hosted 1Password Connect server through its
# API — the only sanctioned way to put data into the Connect LXC. Reads the
# vaulted secrets file (connection + the item list) and upserts each item via
# lxc_onepassword_item. Re-runnable and idempotent (generic_item reconciles by
# title). This play is an API client — it does not touch the node or the CT.
#
#   ansible-playbook playbooks/reflect-onepassword-credentials.yml \
#     -e @inventory/secrets/onepassword.yml --ask-vault-pass
- name: "Reflect credentials into 1Password"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "The Connect connection and item list are present"
      ansible.builtin.assert:
        that:
          - onepassword_host | default('') | length > 0
          - onepassword_vault_id | default('') | length > 0
          - onepassword_token | default('') | length > 0
          - onepassword_mirror_items | default([]) | length > 0
        fail_msg: >-
          Supply onepassword_host, onepassword_vault_id, onepassword_token and
          onepassword_mirror_items — e.g. -e @inventory/secrets/onepassword.yml
          (ansible-vault encrypted).
        quiet: true
    - name: "Upsert each credential into 1Password"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_onepassword_item
      vars:
        lxc_onepassword_item_host: "{{ onepassword_host }}"
        lxc_onepassword_item_token: "{{ onepassword_token }}"
        lxc_onepassword_item_vault_id: "{{ onepassword_vault_id }}"
        lxc_onepassword_item_validate_certs: "{{ onepassword_validate_certs | default(true) }}"
        lxc_onepassword_item_title: "{{ __op_item['title'] }}"
        lxc_onepassword_item_category: "{{ __op_item['category'] | default('api_credential') }}"
        lxc_onepassword_item_fields: "{{ __op_item['fields'] }}"
        lxc_onepassword_item_state: "{{ __op_item['state'] | default('present') }}"
      loop: "{{ onepassword_mirror_items }}"
      loop_control:
        loop_var: __op_item
        label: "{{ __op_item['title'] }}"

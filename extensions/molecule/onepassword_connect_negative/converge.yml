---
- name: Converge (expect a controlled failure)
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: The server entry point must refuse a guest without the baseline marker
      block:
        - name: Run the server entry point on a guest that skipped the baseline
          ansible.builtin.include_role:
            name: get_sybers.lxc.lxc_onepassword_connect
            tasks_from: server
      rescue:
        - name: The role stopped at the baseline assertion
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - "'has not been through get_sybers.lxc.lxc_guest' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              failed, but not at the baseline assertion:
              {{ ansible_failed_result | default({}) }}
            quiet: true
        - name: Record the controlled failure
          ansible.builtin.set_fact:
            __op_connect_failed_cleanly: true
    - name: The failure path was taken
      ansible.builtin.assert:
        that: __op_connect_failed_cleanly | default(false)
        fail_msg: "lxc_onepassword_connect server did not refuse a guest without the baseline marker"
        quiet: true
    - name: Stat the service user (nothing may have been installed)
      ansible.builtin.getent:
        database: passwd
        key: opuser
        fail_key: false
    - name: The refusal came before any change
      ansible.builtin.assert:
        that: not (ansible_facts['getent_passwd']['opuser'] | default(false))
        fail_msg: "the service user exists — server changed the guest before refusing it"
        quiet: true

---
- name: Converge (expect a controlled failure)
  hosts: all
  gather_facts: false
  tasks:
    - name: An unreachable Connect server must stop at the reachability assertion
      block:
        - name: Run lxc_onepassword_item against a closed local port
          ansible.builtin.include_role:
            name: get_sybers.lxc.lxc_onepassword_item
          vars:
            lxc_onepassword_item_host: "http://127.0.0.1:1"
            lxc_onepassword_item_token: "molecule-dummy-token"
            lxc_onepassword_item_vault_id: "molecule-dummy-vault"
            lxc_onepassword_item_validate_certs: false
            lxc_onepassword_item_title: "molecule-negative"
            lxc_onepassword_item_fields:
              - {label: credential, field_type: concealed, value: "molecule"}
      rescue:
        - name: The role stopped at the Connect reachability assertion
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - "'1Password Connect did not return a healthy 200' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              failed, but not at the Connect reachability assertion:
              {{ ansible_failed_result | default({}) }}
            quiet: true
        - name: Record the controlled failure
          ansible.builtin.set_fact:
            __op_item_failed_cleanly: true
    - name: The failure path was taken
      ansible.builtin.assert:
        that: __op_item_failed_cleanly | default(false)
        fail_msg: "lxc_onepassword_item did not fail cleanly on an unreachable Connect server"
        quiet: true

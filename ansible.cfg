[defaults]
# The inventory directory is the single config home: hosts.yml plus
# group_vars/<group>/<topic>.yml. Plays run from this directory need no -i.
inventory = inventory
inject_facts_as_vars = false
ansible_managed = Managed by Ansible (get_sybers.lxc) - do not edit by hand; changes will be overwritten.
interpreter_python = auto_silent
[inventory]
# inventory/secrets/ holds vaulted -e files (never inventory); it is not parsed
# as an inventory source.
ignore_patterns = ^(secrets)$
[privilege_escalation]
become = false
become_method = sudo

---
# ansible-standards §13: the single source of pinned versions. Every galaxy.yml
# dependency appears here pinned to one exact X.Y.Z inside its bound, and nothing
# else in the tree carries a version literal. `scripts/upgrade_pins.py` raises
# these to the highest release still inside the galaxy.yml bound.
collections:
  - name: community.proxmox
    version: "2.1.0"
    source: https://galaxy.ansible.com
  - name: onepassword.connect
    version: "2.4.0"
    source: https://galaxy.ansible.com
  # Test tooling, not runtime dependencies: molecule's docker driver drives the
  # Debian test container through community.docker and syncs the scenario
  # context with ansible.posix.synchronize. Neither is a galaxy.yml dependency,
  # so check_pins reports them as tolerated test-only pins; upgrade_pins raises
  # each within its own major.
  - name: community.docker
    version: "5.4.0"
    source: https://galaxy.ansible.com
  - name: ansible.posix
    version: "1.6.2"
    source: https://galaxy.ansible.com

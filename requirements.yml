---
# ansible-standards §13: the single source of pinned versions. Every galaxy.yml
# dependency appears here pinned to one exact X.Y.Z inside its bound, and nothing
# else in the tree carries a version literal. `scripts/upgrade_pins.py` raises
# these to the highest release still inside the galaxy.yml bound.
collections:
  - name: community.proxmox
    version: "2.1.0"
    source: https://galaxy.ansible.com
  - name: onepassword.connect
    version: "2.4.0"
    source: https://galaxy.ansible.com
  # get_sybers.cluster owns the Proxmox-cluster tier and the single proxmox_config
  # master this collection's inventory projects from. It is first-party and
  # consumed from its git repository (not Galaxy), so it is imported here rather
  # than declared in galaxy.yml — a galaxy.yml dependency resolves from a Galaxy
  # server, which a git-only collection cannot satisfy. The repository is
  # `proxmaxxing`; the collection it builds is get_sybers.cluster. Pinned to the
  # `v0.1.0` release tag (standards §13: an immutable tag is a valid exact pin).
  - name: https://github.com/get-sybers/proxmaxxing.git
    type: git
    version: "v0.1.0"
  # Test and build tooling, not runtime dependencies of the roles: molecule's
  # docker driver drives the Debian test container through community.docker and
  # syncs the scenario context with ansible.posix.synchronize; the template bake
  # (playbooks/bake-template.yml) mounts the chroot's kernel filesystems with
  # ansible.posix.mount and reaches the build rootfs over
  # community.general.chroot. None is a galaxy.yml dependency, so check_pins
  # reports them as tolerated test-only pins; upgrade_pins raises each within
  # its own major.
  - name: community.docker
    version: "5.4.0"
    source: https://galaxy.ansible.com
  - name: ansible.posix
    version: "1.6.2"
    source: https://galaxy.ansible.com
  - name: community.general
    version: "10.3.0"
    source: https://galaxy.ansible.com

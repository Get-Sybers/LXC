---
# The distrobuilder build-box template. Loaded by playbooks/bake-template.yml;
# every input the bake reads is declared here and nowhere else.
lxc_template_name: distrobuilder
# The version baked in is the distrobuilder release; the artifact and the
# release tag (distrobuilder/v<version>) carry the same number. Upstream
# publishes no binaries: the bake builds the release from the Go module
# (github.com/lxc/distrobuilder@v<version>, verified against the Go checksum
# database) with the toolchain its go.mod declares; raise the two together.
lxc_distrobuilder_version: "3.4.0"
lxc_distrobuilder_go_toolchain: go1.25.12
lxc_distrobuilder_arch: amd64
lxc_template_version: "{{ lxc_distrobuilder_version }}"
lxc_template_arch: "{{ lxc_distrobuilder_arch }}"
lxc_template_output: "debian-13-{{ lxc_template_name }}_{{ lxc_template_version }}_{{ lxc_template_arch }}.tar.zst"
# The stock Proxmox system template the bake starts from, and its sha512 as
# published in Proxmox's own index (https://download.proxmox.com/images/aplinfo.dat):
#   python3 scripts/base_template_checksum.py debian-13-standard_13.1-2_amd64.tar.zst
# The bake refuses to run while the checksum is empty.
lxc_template_base_url: "https://download.proxmox.com/images/system/debian-13-standard_13.1-2_amd64.tar.zst"
lxc_template_base_checksum: ""
# The role entry points run inside the rootfs, in order, over the chroot
# connection. The guest baseline first (no sshd, no container runtime, the
# baseline marker), then the build box's chroot-safe install.
lxc_template_bake:
  - role: get_sybers.lxc.lxc_guest
    tasks_from: baseline
  - role: get_sybers.lxc.lxc_distrobuilder
    tasks_from: bake

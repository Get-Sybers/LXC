---
# The distrobuilder build-box template. Loaded by playbooks/bake-template.yml;
# every input the bake reads is declared here and nowhere else.
lxc_template_name: distrobuilder
# The distrobuilder release baked in, and this repository's release of the
# template (X.Y.Z): the artifact, the release tag (distrobuilder/v<version>)
# and the template marker carry the latter. Raise lxc_template_version in every
# PR that changes the image — a new distrobuilder release, a changed bake (the
# Version Gate refuses the PR otherwise); a released version is immutable.
# Upstream publishes no binaries: the bake builds the release from the Go
# module (github.com/lxc/distrobuilder/v3@v<version>, verified against the Go
# checksum database) with the toolchain its go.mod declares; raise the two
# together.
lxc_distrobuilder_version: "3.4.0"
lxc_distrobuilder_go_toolchain: go1.25.12
lxc_distrobuilder_arch: amd64
lxc_template_version: "0.1.3"
lxc_template_service_version: "{{ lxc_distrobuilder_version }}"
lxc_template_arch: "{{ lxc_distrobuilder_arch }}"
lxc_template_output: "debian-13-{{ lxc_template_name }}_{{ lxc_template_version }}_{{ lxc_template_arch }}.tar.zst"
# The stock Proxmox system template the bake starts from, over plain HTTP as
# Proxmox serves it (the checksum is the verification), and its sha512 as
# published in Proxmox's own signed index, read from a node's pveam-verified copy:
#   python3 scripts/base_template_checksum.py debian-13-standard_13.6-1_amd64.tar.zst
# The bake refuses to run while the checksum is empty.
lxc_template_base_url: "http://download.proxmox.com/images/system/debian-13-standard_13.6-1_amd64.tar.zst"
lxc_template_base_checksum: >-
  sha512:4c0c27ca6ceab5ef0b84db57825a00f26157ef1854bafe97297813e1cbe8ecb8cc9c453cab6b3b0efe1ba193a50c47ece1e41d950e411b8730b835b71e9e754b
# The role entry points run inside the rootfs, in order, over the chroot
# connection. The guest baseline first (no sshd, no container runtime, the
# baseline marker), then the build box's chroot-safe install.
lxc_template_bake:
  - role: get_sybers.lxc.lxc_guest
    tasks_from: baseline
  - role: get_sybers.lxc.lxc_distrobuilder
    tasks_from: bake
